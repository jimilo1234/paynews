<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付行业新闻</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #0d0d0d;
  --accent: #6C5CE7;
  --accent-light: #a29bfe;
  --teal: #00CEC9;
  --text: #e0e0e0;
  --text-dim: #888;
}

body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.page { display: none; min-height: 100vh; position: relative; }
.page.active { display: block; }

/* 加载状态 */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-dark); z-index: 9999;
  display: flex; justify-content: center; align-items: center;
  font-size: 14px; color: var(--text-dim);
}
.loading-overlay.hidden { display: none; }

/* 新闻区域通用 */
.page-inner { padding: 30px 20px 40px; }
.newspaper-header { text-align: center; margin-bottom: 30px; }
.newspaper-header h1 { font-size: 28px; font-weight: 700; letter-spacing: 4px; color: var(--accent-light); margin-bottom: 6px; }
.newspaper-header .date { font-size: 13px; color: var(--text-dim); transition: color 0.3s; }
.newspaper-header .date.has-update { color: #ff4d4d; }
.header-line { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin-top: 12px; }
/* Tab 栏 */
.tab-bar { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; color: var(--text-dim); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab-btn.active { color: var(--accent-light); border-bottom-color: var(--accent); }
.tab-btn:hover { color: #ccc; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.tab-panel iframe { width: 100%; height: 70vh; border: none; border-radius: 8px; background: #000; }
.iframe-wrapper { position: relative; }
.iframe-toolbar { display: flex; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
.iframe-wrapper iframe { width: 100%; height: 75vh; border: none; border-radius: 8px; background: #111; }
/* 电影目录 */
.movie-tag {
  display: inline-block; padding: 6px 14px; border-radius: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.movie-tag:hover { background: rgba(108,92,231,0.2); border-color: var(--accent); color: #fff; }
#movie-search:focus { border-color: var(--accent); }

/* 五子棋 */
#gomoku-container { max-width: 480px; margin: 0 auto; padding: 0 8px; }
.gk-title { font-size: 20px; color: #f0f0f0; text-align: center; margin-bottom: 16px; }
.gk-status { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 16px; min-height: 20px; }
.gk-waiting-anim { display: inline-block; animation: gk-pulse 1.5s ease-in-out infinite; }
@keyframes gk-pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
.gk-actions { display: flex; gap: 10px; justify-content: center; }
.gk-btn { padding: 8px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.1); color: #ccc; transition: all 0.2s; }
.gk-btn:hover { background: rgba(255,255,255,0.18); }
.gk-btn-primary { background: var(--accent); color: #fff; }
.gk-btn-primary:hover { opacity: 0.88; }
.gk-btn-danger { background: rgba(255,60,60,0.2); color: #ff6b6b; }
.gk-btn-danger:hover { background: rgba(255,60,60,0.35); }
.gk-game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; }
.gk-player { font-size: 13px; color: #ccc; }
.gk-player.active { color: var(--accent-light); font-weight: 600; }
.gk-turn { font-size: 12px; color: var(--text-dim); }
.gk-board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 0; background: #c8a86e; border-radius: 8px; padding: 4px; aspect-ratio: 1; }
.gk-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 0.5px solid rgba(0,0,0,0.15); transition: background 0.1s; }
.gk-cell:hover { background: rgba(0,0,0,0.08); }
.gk-cell.last-move { box-shadow: inset 0 0 0 2px #e74c3c; }
.gk-stone { width: 80%; height: 80%; border-radius: 50%; }
.gk-stone.black { background: radial-gradient(circle at 35% 35%, #555, #111); }
.gk-stone.white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); border: 1px solid rgba(0,0,0,0.15); }

.news-grid { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.news-item {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 16px 20px; transition: background 0.2s;
}
.news-item:hover { background: rgba(255,255,255,0.07); }
.news-category { font-size: 11px; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
.news-item h3 { font-size: 15px; color: #f0f0f0; margin-bottom: 6px; line-height: 1.5; }
.news-item p { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
.news-item img {
  max-width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer;
  transition: opacity 0.2s;
}
.news-item img:hover { opacity: 0.85; }
/* 图片折叠 */
.img-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 8px; padding: 4px 12px; border-radius: 14px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.img-toggle:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.img-fold { display: none; margin-top: 8px; }
.img-fold.show { display: block; }
.copy-heart {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: transparent; border: 1.5px solid rgba(255,255,255,0.2);
  cursor: pointer; transition: all 0.2s; margin-top: 8px; font-size: 14px;
  color: rgba(255,255,255,0.35);
}
.copy-heart:hover {
  border-color: #ff6b8a; color: #ff6b8a;
  background: rgba(255,107,138,0.08);
}
.copy-heart.copied {
  border-color: #ff6b8a; color: #ff6b8a;
  background: rgba(255,107,138,0.12);
}
/* 游客ID时间标记 */
.news-category-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.guest-id { font-size: 11px; color: #6e6e6e; letter-spacing: 0.5px; }
/* 语音录制 */
.voice-btn { font-size: 22px; cursor: pointer; transition: transform 0.15s; user-select: none; }
.voice-btn:hover { transform: scale(1.15); }
.voice-btn.recording { animation: pulse-red 1s infinite; }
@keyframes pulse-red { 0%,100%{color:#ff6b6b;} 50%{color:#ff3333;} }
.recording-bar {
  display: none; align-items: center; gap: 10px;
  max-width: 800px; margin: 4px auto 0; padding: 8px 12px;
  background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.2);
  border-radius: 8px; font-size: 13px; color: #ff6b6b;
}
.recording-bar.show { display: flex; }
.recording-bar .rec-dot { width:8px; height:8px; border-radius:50%; background:#ff4444; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.recording-bar .rec-stop {
  margin-left: auto; padding: 4px 12px; border-radius: 6px;
  background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.3);
  color: #ff6b6b; cursor: pointer; font-size: 12px;
}
.recording-bar .rec-stop:hover { background: rgba(255,60,60,0.25); }
.voice-preview {
  display: none; align-items: center; gap: 8px;
  max-width: 800px; margin: 4px auto 0; padding: 6px 12px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; font-size: 12px; color: var(--text-dim);
}
.voice-preview.show { display: flex; }
.voice-preview .voice-del {
  margin-left: auto; cursor: pointer; color: #ff6b6b; font-size: 14px;
}
.news-item audio {
  width: 100%; max-width: 280px; height: 36px; margin-top: 8px;
  border-radius: 8px;
}

/* 底部登录区 */
.login-section {
  max-width: 800px; margin: 0 auto; padding: 24px 0 60px;
  text-align: center;
}
.login-section .login-divider {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.login-section .login-divider::before,
.login-section .login-divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
}
.login-section .login-divider span { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.login-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 24px; max-width: 340px; margin: 0 auto;
}
.login-card .input-group { margin-bottom: 16px; }
.login-card .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-align: left; }
.login-card .input-group input {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: none !important; background: rgba(255,255,255,0.05);
  color: #fff; font-size: 14px; outline: none; transition: background 0.2s;
}
.login-card .input-group input:focus { background: rgba(255,255,255,0.08); }
.login-btn {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px;
}
.login-btn:hover { background: #7c6cf7; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-error { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 18px; }

/* 退出按钮 */
.logout-btn {
  position: fixed; top: 18px; right: 20px; z-index: 200;
  background: rgba(108,92,231,0.25); color: #fff;
  border: 1px solid rgba(108,92,231,0.4);
  padding: 8px 24px; border-radius: 20px; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.logout-btn:hover { background: var(--accent); }

/* 发留言区 */
.message-input-area {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13,13,13,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08); padding: 12px 20px; z-index: 100;
}
.input-row { display: flex; gap: 8px; align-items: center; max-width: 800px; margin: 0 auto; }
.input-row input[type="text"] {
  flex: 1; padding: 10px 14px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06);
  color: #fff; font-size: 14px; outline: none; transition: border 0.2s;
}
.input-row input[type="text"]:focus { border-color: var(--accent); }
.img-upload-btn { font-size: 22px; cursor: pointer; transition: transform 0.15s; user-select: none; }
.img-upload-btn:hover { transform: scale(1.15); }
.send-btn {
  padding: 8px 20px; border: none; border-radius: 20px;
  background: var(--accent); color: #fff; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: background 0.2s;
}
.send-btn:hover { background: #7c6cf7; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.refresh-btn {
  padding: 8px 16px; border: 1px solid rgba(108,92,231,0.4); border-radius: 20px;
  background: rgba(108,92,231,0.15); color: var(--accent-light); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.refresh-btn:hover { background: rgba(108,92,231,0.3); }
.refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.preview-area { max-width: 800px; margin: 4px auto 0; }
.preview-area img { max-height: 60px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }

/* 图片放大查看 */
.img-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85); z-index: 999;
  justify-content: center; align-items: center; cursor: pointer;
}
.img-overlay.show { display: flex; }
.img-overlay img {
  max-width: 90vw; max-height: 90vh; border-radius: 8px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}

/* 响应式 */
@media (max-width: 640px) {
  .newspaper-header h1 { font-size: 22px; }
}
  </style>
</head>
<body>

  <!-- 加载层 -->
  <div class="loading-overlay" id="loading-overlay">加载中...</div>

  <!-- 页面1：首页（新闻+底部登录） -->
  <div id="public-page" class="page active">
    <div class="page-inner">
      <div class="newspaper-header">
        <h1>支付行业新闻</h1>
        <p class="date" id="public-news-date"></p>
        <div class="header-line"></div>
      </div>
      <div class="news-grid" id="public-news-grid"></div>
      <div class="login-section">
        <div class="login-divider"><span>发布留言</span></div>
        <div class="login-card">
          <div class="input-group">
            <label>用户名称</label>
            <input type="text" id="login-account" autocomplete="off">
          </div>
          <div class="input-group">
            <label>留言</label>
            <input type="text" id="login-password" autocomplete="off">
          </div>
          <button class="login-btn" id="login-btn">发布新闻</button>
          <p class="login-error" id="login-error"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 页面2：登录后 -->
  <div id="member-page" class="page">
    <button class="logout-btn" id="logout-btn">刷新新闻</button>
    <div class="page-inner" style="padding-bottom:80px;">
      <div class="newspaper-header">
        <h1>支付行业新闻</h1>
        <p class="date" id="member-news-date"></p>
        <div class="header-line"></div>
      </div>
      <!-- Tab 切换栏 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-news">行业简报</button>
        <button class="tab-btn" data-tab="tab-movie">行业模型</button>
        <button class="tab-btn" data-tab="tab-video">行业政策</button>
      </div>
      <!-- Tab 内容区 -->
      <div class="tab-panel active" id="tab-news">
        <div class="news-grid" id="member-news-grid"></div>
      </div>
      <!-- 行业模型 tab：电影播放器 -->
      <div class="tab-panel" id="tab-movie">
        <!-- 电影目录页 -->
        <div id="movie-catalog">
          <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
            <input type="text" id="movie-search" placeholder="输入IMDB ID（如 tt0111161）" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:13px;outline:none;">
            <button class="gk-btn gk-btn-primary" style="font-size:12px;padding:6px 14px;white-space:nowrap;" onclick="moviePlay()">▶ 播放</button>
          </div>
          <p style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">👇 点击直接播放 | 或在上方输入IMDB ID</p>
          <div id="movie-presets" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
        </div>
        <!-- 播放器页 -->
        <div id="movie-player-wrap" style="display:none;">
          <div class="iframe-toolbar">
            <button class="gk-btn" style="font-size:12px;padding:4px 12px;" onclick="movieBack()">← 返回目录</button>
            <span id="movie-now-title" style="font-size:12px;color:var(--text-dim);margin-left:8px;"></span>
            <button class="gk-btn" style="font-size:12px;padding:4px 12px;margin-left:auto;" onclick="document.getElementById('movie-player').src=document.getElementById('movie-player').src">🔄 刷新</button>
          </div>
          <iframe id="movie-player" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allowfullscreen></iframe>
        </div>
      </div>
      <div class="tab-panel" id="tab-video">
        <!-- 右边tab的新闻+评论（跟左边一样） -->
        <div class="news-grid" id="gk-news-grid"></div>
        <div id="gomoku-container">
          <!-- 大厅：准备匹配 -->
          <div id="gk-lobby">
            <h3 class="gk-title">♟ 五子棋</h3>
            <div id="gk-lobby-status" class="gk-status">点击准备，等待对手匹配</div>
            <div class="gk-actions">
              <button class="gk-btn gk-btn-primary" id="gk-ready-btn" onclick="gomokuReady()">准备</button>
            </div>
          </div>
          <!-- 等待匹配 -->
          <div id="gk-waiting" style="display:none;">
            <h3 class="gk-title">♟ 五子棋</h3>
            <div class="gk-status"><span class="gk-waiting-anim">等待对手加入</span></div>
            <div class="gk-actions">
              <button class="gk-btn gk-btn-danger" onclick="gomokuCancelReady()">取消</button>
            </div>
          </div>
          <!-- 游戏中 -->
          <div id="gk-game" style="display:none;">
            <div class="gk-game-header">
              <span id="gk-p1" class="gk-player">⚫ ???</span>
              <span id="gk-turn-info" class="gk-turn">VS</span>
              <span id="gk-p2" class="gk-player">⚪ ???</span>
            </div>
            <div id="gk-board" class="gk-board"></div>
            <div class="gk-actions">
              <button class="gk-btn gk-btn-danger" onclick="gomokuLeave()">认输离开</button>
            </div>
          </div>
          <!-- 结算 -->
          <div id="gk-result" style="display:none;">
            <h3 class="gk-title" id="gk-result-text"></h3>
            <div class="gk-actions">
              <button class="gk-btn gk-btn-primary" onclick="gomokuBackLobby()">再来一局</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="message-input-area">
      <div class="input-row">
        <input type="text" id="msg-text" placeholder="写点什么..." maxlength="200">
        <label class="img-upload-btn" title="上传图片">
          📷
          <input type="file" id="msg-image" accept="image/*" hidden>
        </label>
        <span class="voice-btn" id="voice-btn" title="录制语音">📢</span>
        <button class="refresh-btn" id="refresh-btn">🔄 刷新</button>
        <button class="send-btn" id="send-btn">发布新闻</button>
      </div>
      <div class="recording-bar" id="recording-bar">
        <span class="rec-dot"></span>
        <span id="rec-timer">0:00</span>
        <span class="rec-stop" id="rec-stop">⏹ 停止</span>
      </div>
      <div class="voice-preview" id="voice-preview">
        🎤 语音已录制 <span id="voice-dur"></span>
        <span class="voice-del" id="voice-del">✕</span>
      </div>
      <div class="preview-area" id="preview-area"></div>
    </div>
  </div>

  <!-- 图片放大层 -->
  <div class="img-overlay" id="img-overlay">
    <img id="img-overlay-src" src="" alt="放大查看">
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function showOverlay(src) {

  overlay.classList.add('show');

function getDateStr() {
  const now = new Date();
  return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 每日简报`;
}

// ===== 渲染新闻 =====
function renderNews(containerId, dateId, userMessages, isAutoRefresh) {
  const container = document.getElementById(containerId);
  const dateEl = document.getElementById(dateId);
  dateEl.textContent = getDateStr();

  // 自动刷新时检测新消息 → 日期变红
  if (dateId === 'member-news-date') {
    const newSnapshot = userMessages.map(m => m.id || m.created_at).join(',');
    if (isAutoRefresh && lastMessageSnapshot && newSnapshot !== lastMessageSnapshot) {
      dateEl.classList.add('has-update');
      document.title = '支付行业新闻1.0';
    }
    lastMessageSnapshot = newSnapshot;
  }

  let html = MOCK_NEWS.map(item => `
    <div class="news-item">
      <div class="news-category">${item.category}</div>
      <h3>${item.title}</h3>
      <p>${item.summary}</p>
    </div>
  `).join('');

  // 追加用户留言伪装成"行业评论"（最多2条：最新为主标题，上一条文字追加在小字后）
  if (userMessages && userMessages.length > 0) {
    const newestMsg = userMessages[userMessages.length - 1];
    const olderMsg = userMessages.length >= 2 ? userMessages[userMessages.length - 2] : null;

    let msgHtml = `<div class="news-item">`;
    // 游客ID时间标记
    const ts = newestMsg.created_at ? new Date(newestMsg.created_at) : new Date();
    const hh = String(ts.getHours()).padStart(2,'0');
    const mm = String(ts.getMinutes()).padStart(2,'0');
    const ss = String(ts.getSeconds()).padStart(2,'0');
    msgHtml += `<div class="news-category-line"><div class="news-category">行业评论</div><div class="guest-id">线上网友${hh}${mm}${ss}</div></div>`;
    if (newestMsg.text) msgHtml += `<h3>${escapeHtml(newestMsg.text)}</h3>`;
    // 评论下方添加伪装描述（取第一条新闻摘要）
    let summaryContent = '';
    if (MOCK_NEWS.length > 0) summaryContent = MOCK_NEWS[0].summary;
    // 如果有上一条旧消息，将其文字追加在摘要后面（小字样式）
    if (olderMsg && olderMsg.text) {
      summaryContent += `<span style="color:var(--text-dim);font-size:13px;"> ${escapeHtml(olderMsg.text)}</span>`;
    }
    if (summaryContent) msgHtml += `<p>${summaryContent}</p>`;
    if (newestMsg.image_url) msgHtml += `<span class="img-toggle" onclick="toggleImg(this)">📷 查看图片</span><div class="img-fold"><img src="${newestMsg.image_url}" alt="配图" onclick="showOverlay(this.src)"></div>`;
    if (newestMsg.audio_url) msgHtml += `<audio controls src="${newestMsg.audio_url}" preload="metadata"></audio>`;
    // 爱心复制按钮
    const copyText = newestMsg.text || '';
    msgHtml += `<span class="copy-heart" onclick="copyComment(this, '${escapeHtml(copyText).replace(/'/g, "\\'")}')" title="复制评论">♡</span>`;
    msgHtml += `</div>`;
    html += msgHtml;
  }

  container.innerHTML = html;
  // 同步更新五子棋页面的新闻摘要
  if (containerId === 'member-news-grid' && userMessages && userMessages.length > 0) {
    gkRenderNews(userMessages);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 展开/折叠图片
function toggleImg(el) {
  const foldDiv = el.nextElementSibling;
  if (foldDiv.classList.contains('show')) {
    foldDiv.classList.remove('show');
    el.textContent = '📷 查看图片';
  } else {
    foldDiv.classList.add('show');
    el.textContent = '📷 收起图片';
  }
}

// 复制评论到剪贴板
function copyComment(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    el.textContent = '♥';
    setTimeout(() => {
      el.classList.remove('copied');
      el.textContent = '♡';
    }, 1500);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    el.classList.add('copied');
    el.textContent = '♥';
    setTimeout(() => { el.classList.remove('copied'); el.textContent = '♡'; }, 1500);
  });
}

// 登录验证
async function verifyLogin(username, password) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const { data, error } = await supabaseClient.rpc('verify_login', {
    p_username: username,
    p_password: password
  });
  if (error) throw error;
  return data; // [{ display_name: 'xxx' }] or []
}

// 获取所有留言
async function fetchMessages() {
  if (!supabaseClient) return [];
  const { data, error } = await supabaseClient
    .from('messages')
    .select('*')
    .order('id', { ascending: true });
  if (error) {
    console.error('获取留言失败:', error);
    return [];
  }
  return data || [];
}

// 发送留言（最多保留2条，滚动覆盖最旧的）
async function sendMessage(username, displayName, text, imageUrl, audioUrl) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  // 先插入新留言（不设created_at，让数据库用now()自动填充）
  const { error: insertErr } = await supabaseClient
    .from('messages')
    .insert({
      username: username,
      display_name: displayName,
      text: text || '',
      image_url: imageUrl || null,
      audio_url: audioUrl || null
    });
  if (insertErr) throw insertErr;
  // 插入成功后，查询所有消息（按id排序），只保留最新2条
  const { data: allMsgs } = await supabaseClient
    .from('messages')
    .select('id')
    .order('id', { ascending: true });
  if (allMsgs && allMsgs.length > 2) {
    const idsToDelete = allMsgs.slice(0, allMsgs.length - 2).map(m => m.id);
    const { error: delErr } = await supabaseClient
      .from('messages')
      .delete()
      .in('id', idsToDelete);
    if (delErr) console.warn('删除旧留言失败:', delErr);
  }
}

// 上传图片到 Supabase Storage（共享文件名，任何账号上传都覆盖旧图）
async function uploadImage(file, username) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const ext = file.name.split('.').pop().toLowerCase();
  const fixedPath = `shared_image.${ext}`;

  // 删除所有旧图片格式
  const possibleExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
  for (const oldExt of possibleExts) {
    try {
      await supabaseClient.storage.from('images').remove([`shared_image.${oldExt}`]);
    } catch (e) { /* 旧文件不存在则忽略 */ }
  }

  // 上传新图
  const { data, error } = await supabaseClient.storage
    .from('images')
    .upload(fixedPath, file, { contentType: file.type });
  if (error) throw error;
  const { data: urlData } = supabaseClient.storage
    .from('images')
    .getPublicUrl(fixedPath);
  return urlData.publicUrl + '?t=' + Date.now();
}

// 上传语音到 Supabase Storage（共享文件名，任何账号上传都覆盖旧语音）
async function uploadAudio(blob, username) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const ext = blob.type.includes('mp4') ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const fixedPath = `shared_voice.${ext}`;

  // 删除所有旧语音格式
  const possibleExts = ['webm', 'ogg', 'm4a'];
  for (const oldExt of possibleExts) {
    try { await supabaseClient.storage.from('images').remove([`shared_voice.${oldExt}`]); } catch(e) {}
  }

  // 上传
  const { data, error } = await supabaseClient.storage
    .from('images')
    .upload(fixedPath, blob, { contentType: blob.type || 'audio/webm' });
  if (error) throw error;

  const { data: urlData } = supabaseClient.storage
    .from('images')
    .getPublicUrl(fixedPath);
  return urlData.publicUrl + '?t=' + Date.now();
}

let pendingVoiceBlob = null;
let pendingVoiceMime = 'audio/webm';
let mediaRecorder = null;
let recChunks = [];
let recTimer = null;
let recSeconds = 0;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // 选择浏览器支持的 mimeType
    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/webm;codecs=opus';
    }
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/ogg;codecs=opus';
    }
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/mp4';
    }
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    recChunks = [];
    recSeconds = 0;
    const finalMimeType = mimeType;

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      pendingVoiceBlob = new Blob(recChunks, { type: finalMimeType });
      pendingVoiceMime = finalMimeType;
      const dur = recSeconds;
      document.getElementById('recording-bar').classList.remove('show');
      document.getElementById('voice-btn').classList.remove('recording');
      document.getElementById('voice-preview').classList.add('show');
      document.getElementById('voice-dur').textContent = `${dur}秒`;
      clearInterval(recTimer);
    };

    mediaRecorder.start();
    document.getElementById('recording-bar').classList.add('show');
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('rec-timer').textContent = '0:00';

    recTimer = setInterval(() => {
      recSeconds++;
      const m = Math.floor(recSeconds / 60);
      const s = recSeconds % 60;
      document.getElementById('rec-timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (recSeconds >= 60) stopRecording();
    }, 1000);
  } catch (err) {
    console.error('无法获取麦克风:', err);
    alert('无法访问麦克风，请检查权限设置');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

function cancelVoice() {
  pendingVoiceBlob = null;
  document.getElementById('voice-preview').classList.remove('show');
  document.getElementById('voice-dur').textContent = '';
}

async function doLogin() {
  const account = document.getElementById('login-account').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errorEl = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');

  if (!account || !password) {
    errorEl.textContent = '请输入账号和密码';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '验证中...';
  errorEl.textContent = '';

  try {
    const result = await verifyLogin(account, password);
    if (!result || result.length === 0) {
      errorEl.textContent = '活动火热，稍后再试';
      return;
    }

    currentUser = {
      username: account,
      displayName: result[0].display_name
    };

    // 加载留言并进入会员页
    const messages = await fetchMessages();
    document.getElementById('public-page').classList.remove('active');
    document.getElementById('member-page').classList.add('active');
    renderNews('member-news-grid', 'member-news-date', messages);

  } catch (err) {
    console.error('登录失败:', err);
    errorEl.textContent = '活动火热，稍后再试';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '发布新闻';
  }
}

function doLogout() {
  currentUser = null;
  pendingImage = null;
  pendingImageFile = null;
  pendingVoiceBlob = null;
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  document.getElementById('member-page').classList.remove('active');
  document.getElementById('public-page').classList.add('active');
  document.getElementById('login-account').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('preview-area').innerHTML = '';
  document.getElementById('voice-preview').classList.remove('show');
  document.getElementById('voice-dur').textContent = '';
  // 刷新公共页留言
  loadPublicMessages();
}

async function doSendMessage() {
  if (!currentUser) return;
  const text = document.getElementById('msg-text').value.trim();
  if (!text && !pendingImageFile && !pendingVoiceBlob) return;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.textContent = '发布中...';

  try {
    let imageUrl = null;
    let audioUrl = null;

    // 上传图片（如果有）
    if (pendingImageFile) {
      imageUrl = await uploadImage(pendingImageFile, currentUser.username);
    }

    // 上传语音（如果有）
    if (pendingVoiceBlob) {
      audioUrl = await uploadAudio(pendingVoiceBlob, currentUser.username);
    }

    // 发送留言
    await sendMessage(currentUser.username, currentUser.displayName, text, imageUrl, audioUrl);

    // 清空输入
    document.getElementById('msg-text').value = '';
    pendingImage = null;
    pendingImageFile = null;
    pendingVoiceBlob = null;
    document.getElementById('preview-area').innerHTML = '';
    document.getElementById('voice-preview').classList.remove('show');
    document.getElementById('voice-dur').textContent = '';

    // 刷新留言
    const messages = await fetchMessages();
    renderNews('member-news-grid', 'member-news-date', messages);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  } catch (err) {
    console.error('发布失败:', err);
    alert('发布失败: ' + (err.message || '请重试'));
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发布新闻';
  }
}

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    pendingImage = ev.target.result;
    document.getElementById('preview-area').innerHTML = `<img src="${pendingImage}" alt="预览">`;
  };
  reader.readAsDataURL(file);
}

const GK_SIZE = 15;
let gkCurrentGame = null; // { id, player1, player2, board, current_turn, status, myRole }
let gkPollTimer = null;

function gkShow(view) {
  document.getElementById('gk-lobby').style.display = view === 'lobby' ? '' : 'none';
  document.getElementById('gk-waiting').style.display = view === 'waiting' ? '' : 'none';
  document.getElementById('gk-game').style.display = view === 'game' ? '' : 'none';
  document.getElementById('gk-result').style.display = view === 'result' ? '' : 'none';
  // 游戏中隐藏新闻，其他状态显示
  document.getElementById('gk-news-grid').style.display = view === 'game' ? 'none' : '';
}

  renderNews('gk-news-grid', 'member-news-date', lastMsg);
}

function gkStopPoll() { if (gkPollTimer) { clearInterval(gkPollTimer); gkPollTimer = null; } }
function gkStartPoll(mode) {
  gkStopPoll();
  if (mode === 'waiting') { gkPollTimer = setInterval(gkSyncWaiting, 1500); }
  else { gkPollTimer = setInterval(gkSyncGame, 2000); }
}

// 清理过期数据
async function gkCleanup() {
  if (!supabaseClient) return;
  const oneHourAgo = new Date(Date.now() - 3600000).toISOString();
  await supabaseClient.from('gomoku_games').delete().eq('status','finished').lt('updated_at', oneHourAgo);
  const tenMinAgo = new Date(Date.now() - 600000).toISOString();
  await supabaseClient.from('gomoku_games').delete().eq('status','waiting').lt('created_at', tenMinAgo);
}

// 点击"准备"：匹配模式
async function gomokuReady() {
  if (!supabaseClient || !currentUser) return;
  await gkCleanup();

  // 1. 先查有没有等待中的游戏（别人已准备，缺对手）
  const { data: waiting } = await supabaseClient
    .from('gomoku_games')
    .select('*')
    .eq('status', 'waiting')
    .neq('player1', currentUser.username)
    .order('created_at', { ascending: true })
    .limit(1);

  if (waiting && waiting.length > 0) {
    // 2. 有人等 → 加入并直接开局
    const g = waiting[0];
    const { data: updated, error } = await supabaseClient
      .from('gomoku_games')
      .update({
        player2: currentUser.username,
        player2_name: currentUser.displayName,
        status: 'playing'
      })
      .eq('id', g.id)
      .select()
      .single();
    if (error) { alert('加入失败: ' + error.message); return; }
    // 更新可能被别人抢了，检查 player2 是否是自己
    if (updated.player2 !== currentUser.username) {
      // 被抢了，重新尝试
      gomokuReady();
      return;
    }
    gkCurrentGame = { ...updated, myRole: 2 };
    gkRenderGame();
    gkShow('game');
    gkStartPoll('game');
  } else {
    // 3. 没人等 → 自己创建等待
    const board = '0'.repeat(GK_SIZE * GK_SIZE);
    const { data: created, error } = await supabaseClient
      .from('gomoku_games')
      .insert({
        player1: currentUser.username,
        player1_name: currentUser.displayName,
        board: board,
        current_turn: 1,
        status: 'waiting',
        winner: 0
      })
      .select()
      .single();
    if (error) { alert('准备失败: ' + error.message); return; }
    gkCurrentGame = { ...created, myRole: 1 };
    gkShow('waiting');
    gkStartPoll('waiting');
  }
}

// 取消等待
async function gomokuCancelReady() {
  if (!gkCurrentGame) return;
  await supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id);
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}

// 等待中的轮询：检查是否有人加入
async function gkSyncWaiting() {
  if (!gkCurrentGame) return;
  const { data } = await supabaseClient.from('gomoku_games').select('*').eq('id', gkCurrentGame.id).single();
  if (!data) { gkCurrentGame = null; gkStopPoll(); gkShow('lobby'); return; }
  gkCurrentGame = { ...data, myRole: gkCurrentGame.myRole };
  if (data.status === 'playing' && data.player2) {
    // 对手来了，直接开局
    gkStopPoll();
    gkRenderGame();
    gkShow('game');
    gkStartPoll('game'); // 游戏中2秒轮询
  }
}

// 游戏中轮询
async function gkSyncGame() {
  if (!gkCurrentGame) return;
  const { data } = await supabaseClient.from('gomoku_games').select('*').eq('id', gkCurrentGame.id).single();
  if (!data) { gomokuBackLobby(); return; }
  gkCurrentGame = { ...data, myRole: gkCurrentGame.myRole };
  if (data.status === 'finished') {
    gkStopPoll();
    const w = data.winner;
    const myRole = gkCurrentGame.myRole;
    let txt = w === 3 ? '平局！' : (w === myRole ? '🎉 你赢了！' : '😢 你输了');
    document.getElementById('gk-result-text').textContent = txt;
    gkShow('result');
    // 自动清理
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', data.id), 5000);
    return;
  }
  gkRenderGame();
}

function gkRenderGame() {
  if (!gkCurrentGame) return;
  const g = gkCurrentGame;
  const isPlaying = g.status === 'playing';
  const p1el = document.getElementById('gk-p1');
  const p2el = document.getElementById('gk-p2');
  const turnEl = document.getElementById('gk-turn-info');
  p1el.textContent = '⚫ ' + (g.player1_name || '???');
  p2el.textContent = '⚪ ' + (g.player2_name || '???');
  p1el.classList.toggle('active', isPlaying && g.current_turn === 1);
  p2el.classList.toggle('active', isPlaying && g.current_turn === 2);
  turnEl.textContent = isPlaying ? (g.current_turn === g.myRole ? '轮到你了' : '对方思考中...') : 'VS';
  gkRenderBoard(g);
}

function gkRenderBoard(g) {
  const boardEl = document.getElementById('gk-board');
  const board = g.board || '0'.repeat(225);
  const isPlaying = g.status === 'playing';
  const isMyTurn = isPlaying && g.current_turn === g.myRole;
  let lastIdx = -1;
  if (g.last_move) lastIdx = g.last_move;

  let html = '';
  for (let i = 0; i < 225; i++) {
    const v = parseInt(board[i]);
    const isLast = i === lastIdx;
    let inner = '';
    if (v === 1) inner = '<div class="gk-stone black"></div>';
    else if (v === 2) inner = '<div class="gk-stone white"></div>';
    const clickable = isMyTurn && v === 0;
    html += `<div class="gk-cell${isLast ? ' last-move' : ''}" ${clickable ? `onclick="gomokuPlace(${i})"` : ''}>${inner}</div>`;
  }
  boardEl.innerHTML = html;
}

async function gomokuPlace(idx) {
  if (!gkCurrentGame || gkCurrentGame.status !== 'playing') return;
  if (gkCurrentGame.current_turn !== gkCurrentGame.myRole) return;
  const board = gkCurrentGame.board;
  if (board[idx] !== '0') return;

  const newBoard = board.substring(0, idx) + String(gkCurrentGame.myRole) + board.substring(idx + 1);
  const nextTurn = gkCurrentGame.myRole === 1 ? 2 : 1;
  const win = gkCheckWin(newBoard, idx, gkCurrentGame.myRole);

  if (win) {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, status: 'finished', winner: gkCurrentGame.myRole, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.status = 'finished';
    gkCurrentGame.winner = gkCurrentGame.myRole;
    gkRenderBoard(gkCurrentGame);
    document.getElementById('gk-result-text').textContent = '🎉 你赢了！';
    gkShow('result');
    gkStopPoll();
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id), 5000);
  } else if (newBoard.indexOf('0') === -1) {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, status: 'finished', winner: 3, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.status = 'finished';
    gkRenderBoard(gkCurrentGame);
    document.getElementById('gk-result-text').textContent = '平局！';
    gkShow('result');
    gkStopPoll();
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id), 5000);
  } else {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.current_turn = nextTurn;
    gkRenderBoard(gkCurrentGame);
  }
}

function gkCheckWin(board, idx, player) {
  const row = Math.floor(idx / GK_SIZE), col = idx % GK_SIZE;
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const r = row + dr*d, c = col + dc*d;
      if (r < 0 || r >= GK_SIZE || c < 0 || c >= GK_SIZE) break;
      if (board[r * GK_SIZE + c] !== String(player)) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const r = row - dr*d, c = col - dc*d;
      if (r < 0 || r >= GK_SIZE || c < 0 || c >= GK_SIZE) break;
      if (board[r * GK_SIZE + c] !== String(player)) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

function gomokuLeave() {
  if (!gkCurrentGame) return;
  const g = gkCurrentGame;
  if (g.status === 'waiting') {
    supabaseClient.from('gomoku_games').delete().eq('id', g.id);
  } else if (g.status === 'playing') {
    const winner = g.myRole === 1 ? 2 : 1;
    supabaseClient.from('gomoku_games').update({ status: 'finished', winner: winner, updated_at: new Date().toISOString() }).eq('id', g.id);
  }
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}

function gomokuBackLobby() {
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}

  </script>
