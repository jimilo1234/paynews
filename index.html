<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付行业新闻</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #0d0d0d;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --border-card: rgba(255,255,255,0.06);
  --border-input: rgba(255,255,255,0.1);
  --bg-input: rgba(255,255,255,0.05);
  --bg-input-focus: rgba(255,255,255,0.08);
  --bg-bar: rgba(13,13,13,0.95);
  --bg-overlay: rgba(0,0,0,0.85);
  --accent: #6C5CE7;
  --accent-light: #a29bfe;
  --teal: #00CEC9;
  --text: #e0e0e0;
  --text-bright: #f0f0f0;
  --text-dim: #888;
  --text-muted: #6e6e6e;
  --board-bg: #c8a86e;
  --cell-border: rgba(0,0,0,0.15);
  --cell-hover: rgba(0,0,0,0.08);
}
html.light {
  --bg-dark: #f5f5f7;
  --bg-card: rgba(0,0,0,0.03);
  --bg-card-hover: rgba(0,0,0,0.06);
  --border-card: rgba(0,0,0,0.08);
  --border-input: rgba(0,0,0,0.15);
  --bg-input: rgba(0,0,0,0.04);
  --bg-input-focus: rgba(0,0,0,0.07);
  --bg-bar: rgba(245,245,247,0.95);
  --bg-overlay: rgba(0,0,0,0.5);
  --accent: #5a4bd1;
  --accent-light: #6C5CE7;
  --teal: #00b4b0;
  --text: #2c2c2e;
  --text-bright: #1c1c1e;
  --text-dim: #6e6e73;
  --text-muted: #999;
  --board-bg: #d4b877;
  --cell-border: rgba(0,0,0,0.12);
  --cell-hover: rgba(0,0,0,0.06);
}

body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.page { display: none; min-height: 100vh; position: relative; }
.page.active { display: block; }

/* 加载状态 */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-dark); z-index: 9999;
  display: flex; justify-content: center; align-items: center;
  font-size: 14px; color: var(--text-dim);
}

/* 日夜切换按钮 */
.theme-toggle {
  position: fixed; top: 18px; right: 140px; z-index: 200;
  background: rgba(108,92,231,0.25); color: #fff;
  border: 1px solid rgba(108,92,231,0.4);
  padding: 6px 10px; border-radius: 20px; font-size: 0;
  cursor: pointer; transition: all 0.3s; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { background: var(--accent); }
html.light .theme-toggle { background: rgba(108,92,231,0.15); border-color: rgba(108,92,231,0.3); }

/* 对讲机订阅开关 */
.walkie-sub-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  background: none; color: var(--text-dim);
  font-size: 13px; cursor: pointer; user-select: none;
  border: none; padding: 2px 0; font-size: 11px;
  cursor: pointer; transition: color 0.3s; user-select: none;
  white-space: nowrap; opacity: 0.6;
  vertical-align: middle;
}
.walkie-sub-toggle:hover { opacity: 0.9; }
.walkie-sub-toggle.on { color: var(--text-muted); opacity: 0.7; }
.walkie-sub-toggle .toggle-track {
  width: 24px; height: 12px; border-radius: 6px;
  background: rgba(255,255,255,0.08); position: relative;
  transition: background 0.3s; flex-shrink: 0;
}
.walkie-sub-toggle.on .toggle-track { background: rgba(108,92,231,0.3); }
.walkie-sub-toggle .toggle-knob {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-dim); position: absolute; top: 1px; left: 1px;
  transition: all 0.2s;
}
.walkie-sub-toggle.on .toggle-knob { left: 13px; background: var(--accent-light); }
html.light .walkie-sub-toggle { color: var(--text-dim); }
html.light .walkie-sub-toggle .toggle-track { background: rgba(0,0,0,0.06); }
html.light .walkie-sub-toggle.on .toggle-track { background: rgba(108,92,231,0.15); }
html.light .walkie-sub-toggle .toggle-knob { background: var(--text-dim); }
html.light .walkie-sub-toggle.on .toggle-knob { background: var(--accent-light); }

/* 广播订阅中指示条 */
.walkie-broadcast-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 250;
  background: linear-gradient(90deg, #6C5CE7, #00CEC9);
  color: #fff; text-align: center; padding: 6px 0;
  font-size: 13px; font-weight: 500;
  transform: translateY(-100%); transition: transform 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.walkie-broadcast-bar.show { transform: translateY(0); }
.walkie-broadcast-bar .pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #fff;
  animation: broadcast-pulse 1s infinite;
}
@keyframes broadcast-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

.loading-overlay.hidden { display: none; }

/* 新闻区域通用 */
.page-inner { padding: 30px 20px 40px; }
.newspaper-header {
  text-align: center; margin-bottom: 0; padding: 16px 0 0;
  position: relative;
  background: var(--bg-dark);
  transition: box-shadow 0.3s;
}
.tab-bar { background: var(--bg-dark); }
.newspaper-header h1 { font-size: 28px; font-weight: 700; letter-spacing: 4px; color: var(--accent-light); margin-bottom: 6px; }
.newspaper-header .date { font-size: 13px; color: var(--text-dim); transition: color 0.3s; }
.newspaper-header .date.has-update { color: #ff4d4d; }
.header-line { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin-top: 12px; }
/* Tab 栏 */
.tab-bar { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border-card); }
.tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; color: var(--text-dim); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab-btn.active { color: var(--accent-light); border-bottom-color: var(--accent); }
.tab-btn:hover { color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.tab-panel iframe { width: 100%; border: none; border-radius: 8px; background: var(--bg-dark); }
.iframe-wrapper { position: relative; width: 100%; height: 100%; }
.iframe-toolbar { display: flex; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
/* AI助手配置栏 */
.ai-config-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
}
.ai-config-bar input {
  flex: 1;
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.ai-config-bar input:focus {
  border-color: var(--accent);
}
.ai-save-btn, .ai-refresh-btn {
  padding: 8px 14px;
  font-size: 13px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.ai-refresh-btn {
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-save-btn:hover, .ai-refresh-btn:hover { opacity: 0.85; }
.ai-save-btn:active, .ai-refresh-btn:active { transform: scale(0.97); }

.iframe-wrapper iframe { width: 100%; border: none; border-radius: 8px; background: var(--bg-dark); }
/* AI助手 Chat SDK */
#coze-chat-container { border-radius: 12px; overflow: hidden; background: var(--bg-card); }

/* 五子棋 */
#gomoku-container { max-width: 480px; margin: 0 auto; padding: 0 8px; }
.gk-title { font-size: 20px; color: var(--text-bright); text-align: center; margin-bottom: 16px; }
.gk-status { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 16px; min-height: 20px; }
.gk-waiting-anim { display: inline-block; animation: gk-pulse 1.5s ease-in-out infinite; }
@keyframes gk-pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
.gk-actions { display: flex; gap: 10px; justify-content: center; }
.gk-btn { padding: 8px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; background: var(--bg-card); color: var(--text); transition: all 0.2s; }
.gk-btn:hover { background: var(--bg-card-hover); }
.gk-btn-primary { background: var(--accent); color: #fff; }
.gk-btn-primary:hover { opacity: 0.88; }
.gk-btn-danger { background: rgba(255,60,60,0.2); color: #ff6b6b; }
.gk-btn-danger:hover { background: rgba(255,60,60,0.35); }
.gk-game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 8px 12px; background: var(--bg-card); border-radius: 8px; }
.gk-player { font-size: 13px; color: var(--text); }
.gk-player.active { color: var(--accent-light); font-weight: 600; }
.gk-turn { font-size: 12px; color: var(--text-dim); }
.gk-board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 0; background: var(--board-bg); border-radius: 8px; padding: 4px; aspect-ratio: 1; }
.gk-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: 0.5px solid var(--cell-border); transition: background 0.1s; }
.gk-cell:hover { background: var(--cell-hover); }
.gk-cell.last-move { box-shadow: inset 0 0 0 2px #e74c3c; }
.gk-stone { width: 80%; height: 80%; border-radius: 50%; }
.gk-stone.black { background: radial-gradient(circle at 35% 35%, #555, #111); }
.gk-stone.white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); border: 1px solid rgba(0,0,0,0.15); }

.news-grid { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 16px; }
@media (max-width: 767px) {
  .login-card { max-width: 100%; padding: 20px; }
  .login-card .input-group { display: block; width: 100%; margin-right: 0 !important; }
}
@media (min-width: 768px) {
  .news-grid { max-width: 1440px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
}
.news-item {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: 10px; padding: 16px 20px; transition: background 0.2s;
}
.news-item:hover { background: var(--bg-card-hover); }
.news-category { font-size: 11px; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; transition: color 0.3s; }
.news-category.new-msg { color: #a855f7 !important; }
.news-item h3 { font-size: 15px; color: var(--text-bright); margin-bottom: 6px; line-height: 1.5; }
.news-item p { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
.news-item img {
  max-width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer;
  transition: opacity 0.2s;
}
.news-item img:hover { opacity: 0.85; }
/* 图片折叠 */
.img-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 8px; padding: 4px 12px; border-radius: 14px;
  background: var(--bg-card); border: 1px solid var(--border-card);
  color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.img-toggle:hover { background: var(--bg-card-hover); color: var(--text); }
.img-fold { display: none; margin-top: 8px; }
.img-fold.show { display: block; }
.copy-heart {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: transparent; border: 1.5px solid var(--border-input);
  cursor: pointer; transition: all 0.2s; margin-top: 8px; font-size: 14px;
  color: var(--text-muted);
}
.copy-heart:hover {
  border-color: #ff6b8a; color: #ff6b8a;
  background: rgba(255,107,138,0.08);
}
.copy-heart.copied {
  border-color: #ff6b8a; color: #ff6b8a;
  background: rgba(255,107,138,0.12);
}
/* 游客ID时间标记 */
.news-category-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.guest-id { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; transition: color 0.3s; }
.guest-id.broadcasting { color: #111; }
html.light .guest-id.broadcasting { color: #222; }
/* 语音录制 */
.voice-btn { font-size: 22px; cursor: pointer; transition: transform 0.15s; user-select: none; }
.voice-btn:hover { transform: scale(1.15); }
.voice-btn.recording { animation: pulse-red 1s infinite; }
@keyframes pulse-red { 0%,100%{color:#ff6b6b;} 50%{color:#ff3333;} }
.recording-bar {
  display: none; align-items: center; gap: 10px;
  max-width: 800px; margin: 4px auto 0; padding: 8px 12px;
  background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.2);
  border-radius: 8px; font-size: 13px; color: #ff6b6b;
}
.recording-bar.show { display: flex; }
.recording-bar .rec-dot { width:8px; height:8px; border-radius:50%; background:#ff4444; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.recording-bar .rec-stop {
  margin-left: auto; padding: 4px 12px; border-radius: 6px;
  background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.3);
  color: #ff6b6b; cursor: pointer; font-size: 12px;
}
.recording-bar .rec-stop:hover { background: rgba(255,60,60,0.25); }
.voice-preview {
  display: none; align-items: center; gap: 8px;
  max-width: 800px; margin: 4px auto 0; padding: 6px 12px;
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: 8px; font-size: 12px; color: var(--text-dim);
}
.voice-preview.show { display: flex; }
.voice-preview .voice-del {
  margin-left: auto; cursor: pointer; color: #ff6b6b; font-size: 14px;
}
.news-item audio {
  width: 100%; max-width: 280px; height: 36px; margin-top: 8px;
  border-radius: 8px;
}

/* 底部登录区 */
.login-section {
  max-width: 1440px; margin: 0 auto; padding: 24px 0 60px;
  text-align: center;
}
.login-section .login-divider {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.login-section .login-divider::before,
.login-section .login-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border-card);
}
.login-section .login-divider span { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.login-card {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: 16px; padding: 24px 40px; max-width: 1440px; margin: 0 auto;
}
.login-card .input-group { margin-bottom: 16px; display: inline-block; width: calc(50% - 12px); vertical-align: top; text-align: left; }
.login-card .input-group:first-child { margin-right: 24px; }
.login-card .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-align: left; }
.login-card .input-group input {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: none !important; background: var(--bg-input);
  color: var(--text); font-size: 14px; outline: none; transition: background 0.2s;
}
.login-card .input-group input:focus { background: var(--bg-input-focus); }
.login-btn {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px;
}
.login-btn:hover { background: #7c6cf7; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-error { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 18px; }

/* 退出按钮 */
.logout-btn {
  position: fixed; top: 18px; right: 20px; z-index: 200;
  background: rgba(108,92,231,0.25); color: #fff;
  border: 1px solid rgba(108,92,231,0.4);
  padding: 8px 24px; border-radius: 20px; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.logout-btn:hover { background: var(--accent); }

/* 发留言区 */
/* ===== 悬浮评论窗 ===== */
.comment-fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 200;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(108,92,231,0.4);
  transition: all 0.3s; font-size: 0;
}
.comment-fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(108,92,231,0.5); }
.comment-fab.open { border-radius: 50%; background: #e74c3c; }
.comment-fab.open:hover { background: #c0392b; }
.comment-panel {
  position: fixed; right: 16px; bottom: 76px; z-index: 199;
  width: 340px; max-height: 70vh;
  background: var(--bg-bar); backdrop-filter: blur(16px);
  border: 1px solid var(--border-card); border-radius: 16px;
  padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  display: none; flex-direction: column; gap: 10px;
  transition: opacity 0.2s, transform 0.2s;
}
.comment-panel.open { display: flex; }
/* comment-panel-title removed */
.message-input-area {
  position: static; background: none; backdrop-filter: none;
  border-top: none; padding: 0; z-index: auto;
}
.input-row { display: flex; gap: 8px; align-items: stretch; max-width: none; margin: 0; }
.input-col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.input-col textarea {
  flex: 1; padding: 5px 10px; border-radius: 10px;
  border: 1px solid var(--border-input); background: var(--bg-input);
  color: var(--text); font-size: 13px; outline: none; transition: border 0.2s;
  resize: none; min-height: 0; max-height: none; line-height: 1.3;
  font-family: inherit;
}
.input-col textarea:focus { border-color: var(--accent); }
.input-col .send-btn {
  width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: var(--accent); color: #fff; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: background 0.2s;
  white-space: nowrap; flex-shrink: 0;
}
.input-col .send-btn:hover { background: #7c6cf7; }
.input-col .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.input-side-btns {
  display: flex; flex-direction: column; gap: 4px; align-items: center;
  padding: 2px 0; flex-shrink: 0;
}
.input-side-btns .img-upload-btn,
.input-side-btns .voice-btn {
  font-size: 0; cursor: pointer; transition: transform 0.15s; user-select: none;
  padding: 6px 7px; border-radius: 8px; border: 1px solid var(--border-card);
  background: var(--bg-card); color: var(--text); line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.input-side-btns .img-upload-btn:hover,
.input-side-btns .voice-btn:hover { background: var(--bg-card-hover); transform: scale(1.05); }
/* 手机端适配 */
@media (max-width: 767px) {
  .comment-panel { right: 8px; left: 8px; width: auto; bottom: 68px; }
  .comment-fab { right: 12px; bottom: 12px; width: 44px; height: 44px; }
}
.input-side-btns .walkie-btn {
  font-size: 0; cursor: pointer; transition: transform 0.15s; user-select: none;
  padding: 6px 7px; border-radius: 8px; border: 1px solid var(--border-card);
  background: var(--bg-card); color: var(--text); line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.input-side-btns .walkie-btn:hover { background: var(--bg-card-hover); transform: scale(1.05); }
.input-side-btns .walkie-btn.ptt-active {
  background: rgba(255,60,60,0.15); border-color: rgba(255,60,60,0.4);
  color: #ff6b6b; animation: ptt-pulse 0.8s infinite;
}
@keyframes ptt-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

.preview-area { max-width: 600px; margin: 4px auto 0; }
.preview-area img { max-height: 60px; border-radius: 6px; border: 1px solid var(--border-card); }
.preview-area .video-preview-tag { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:var(--bg-card-hover); border:1px solid var(--border-card); border-radius:6px; font-size:12px; color:var(--text-dim); max-width:220px; }
.preview-area .video-preview-tag .video-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.preview-area .video-preview-tag .video-del { cursor:pointer; color:var(--text-dim); padding:0 2px; }
.preview-area .video-preview-tag .video-del:hover { color:var(--accent); }

/* 图片放大查看 */
.img-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-overlay); z-index: 999;
  justify-content: center; align-items: center; cursor: pointer;
}
.img-overlay.show { display: flex; }
.img-overlay img {
  max-width: 90vw; max-height: 90vh; border-radius: 8px;

.voice-room-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px 0; }
.voice-join-btn { display:flex; align-items:center; gap:8px; padding:12px 28px; font-size:15px; color:#fff; background:var(--accent); border:none; border-radius:24px; cursor:pointer; transition:all 0.2s; }
.voice-join-btn:hover { background:var(--accent-light); transform:scale(1.03); }
.voice-join-btn.leaving { background:#e74c3c; }
.voice-join-btn.leaving:hover { background:#c0392b; }
.voice-status { font-size:13px; color:var(--text-dim); }
.voice-status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.voice-status .dot.on { background:#2ecc71; animation:voicePulse 1.5s infinite; }
.voice-status .dot.off { background:var(--text-dim); }
@keyframes voicePulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
#peerjs-voice-area { display:none; margin-top:16px; padding:16px; background:var(--bg-dark); border-radius:12px; }
#peerjs-voice-area.active { display:block; }
.voice-controls { display:flex; gap:12px; align-items:center; justify-content:center; margin-top:12px; }
.voice-ctrl-btn { width:48px; height:48px; border-radius:50%; border:none; background:var(--bg-card); color:var(--text-primary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.voice-ctrl-btn:hover { background:var(--bg-hover); transform:scale(1.05); }
.voice-ctrl-btn.active { background:#2ecc71; color:#fff; }
.voice-ctrl-btn.muted { background:#e74c3c; color:#fff; }
.voice-users { margin-top:12px; font-size:13px; color:var(--text-dim); text-align:center; }
.voice-users .count { color:#2ecc71; font-weight:600; }
#remote-audio-container { display:none; }

// ===== 渲染新闻 =====
function renderNews(containerId, dateId, userMessages, isAutoRefresh) {
  const container = document.getElementById(containerId);
  const dateEl = document.getElementById(dateId);
  dateEl.textContent = getDateStr();

  // 自动刷新时检测新消息 → 日期变红 + 监管动态变紫
  if (dateId === 'member-news-date') {
    const newSnapshot = userMessages.map(m => m.id || m.created_at).join(',');
    if (isAutoRefresh && lastMessageSnapshot && newSnapshot !== lastMessageSnapshot) {
      dateEl.classList.add('has-update');
      document.title = '支付行业新闻1.0';
      hasNewMessages = true;  // 标记有新消息
    }
    lastMessageSnapshot = newSnapshot;
  }

  let html = MOCK_NEWS.map(item => {
    const catClass = hasNewMessages ? 'news-category new-msg' : 'news-category';
    return `
    <div class="news-item">
      <div class="${catClass}">${item.category}</div>
      <h3>${item.title}</h3>
      <p>${item.summary}</p>
    </div>
  `;}).join('');

  // 追加用户留言伪装成"行业评论"（最多2条：最新为主标题，上一条文字追加在小字后）
  if (userMessages && userMessages.length > 0) {
    const newestMsg = userMessages[userMessages.length - 1];
    const olderMsg = userMessages.length >= 2 ? userMessages[userMessages.length - 2] : null;

    let msgHtml = `<div class="news-item">`;
    // 游客ID时间标记
    const ts = newestMsg.created_at ? new Date(newestMsg.created_at) : new Date();
    const hh = String(ts.getHours()).padStart(2,'0');
    const mm = String(ts.getMinutes()).padStart(2,'0');
    const ss = String(ts.getSeconds()).padStart(2,'0');
    msgHtml += `<div class="news-category-line"><div class="news-category">行业评论</div><div class="guest-id"><span class="online-count">${onlineCount > 0 ? onlineCount : ""}</span>线上网友${hh}${mm}${ss}</div></div>`;
    if (newestMsg.text) msgHtml += `<h3>${escapeHtml(newestMsg.text)}</h3>`;
    // 评论下方添加伪装描述（取第一条新闻摘要）
    let summaryContent = '';
    if (MOCK_NEWS.length > 0) summaryContent = MOCK_NEWS[0].summary;
    // 如果有上一条旧消息，将其文字追加在摘要后面（小字样式）
    if (olderMsg && olderMsg.text) {
      summaryContent += `<span style="color:var(--text-dim);font-size:13px;"> ${escapeHtml(olderMsg.text)}</span>`;
    }
    if (summaryContent) msgHtml += `<p>${summaryContent}</p>`;
    if (newestMsg.image_url) msgHtml += `<span class="img-toggle" onclick="toggleImg(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> 查看图片</span><div class="img-fold"><img src="${newestMsg.image_url}" alt="配图" onclick="showOverlay(this.src)"></div>`;
    if (newestMsg.video_url) msgHtml += `<span class="img-toggle" onclick="toggleVideo(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4V8z"/></svg> 查看视频</span><div class="img-fold"><video controls preload="metadata" playsinline style="max-width:100%;border-radius:6px;"><source src="${newestMsg.video_url}" type="video/mp4">您的浏览器不支持视频播放</video></div>`;
    if (newestMsg.audio_url) msgHtml += `<audio controls src="${newestMsg.audio_url}" preload="metadata">您的浏览器不支持语音播放</audio>`;
    // 爱心复制按钮
    const copyText = newestMsg.text || '';
    msgHtml += `<span class="copy-heart" onclick="copyComment(this, '${escapeHtml(copyText).replace(/'/g, "\\'")}')" title="复制评论">${getCopyIcon()}</span>`;
    msgHtml += `</div>`;
    html += msgHtml;
  }

  container.innerHTML = html;
  // 同步更新五子棋页面的新闻摘要（五子棋tab已移除，跳过）
  // if (containerId === 'member-news-grid' && userMessages && userMessages.length > 0) {
  //   gkRenderNews(userMessages);
  // }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

  const foldDiv = el.nextElementSibling;
  if (foldDiv.classList.contains('show')) {
    foldDiv.classList.remove('show');
    el.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> 查看图片';
  } else {
    foldDiv.classList.add('show');
    el.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> 收起图片';

const VIDEO_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4V8z"/></svg>';
function toggleVideo(el) {
  const foldDiv = el.nextElementSibling;
  if (foldDiv.classList.contains("show")) {
    foldDiv.classList.remove("show");
    // 暂停视频
    const v = foldDiv.querySelector("video");
    if (v) v.pause();
    el.innerHTML = VIDEO_ICON_SVG + ' 查看视频';
  } else {
    foldDiv.classList.add("show");
    el.innerHTML = VIDEO_ICON_SVG + ' 收起视频';
  }
}


// 复制评论到剪贴板
function copyComment(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    el.innerHTML = ICO.heartFilled;
    setTimeout(() => {
      el.classList.remove('copied');
      el.innerHTML = getCopyIcon();
    }, 1500);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    el.classList.add('copied');
    el.innerHTML = ICO.heartFilled;
    setTimeout(() => { el.classList.remove('copied'); el.innerHTML = getCopyIcon(); }, 1500);
  });
}

// 登录验证
async function verifyLogin(username, password) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const { data, error } = await supabaseClient.rpc('verify_login', {
    p_username: username,
    p_password: password
  });
  if (error) throw error;
  return data; // [{ display_name: 'xxx' }] or []
}

// 获取所有留言
async function fetchMessages() {
  if (!supabaseClient) return [];
  const { data, error } = await supabaseClient
    .from('messages')
    .select('*')
    .order('id', { ascending: true });
  if (error) {
    console.error('获取留言失败:', error);
    return [];
  }
  return data || [];
}

// 发送留言（最多保留2条，滚动覆盖最旧的）
async function sendMessage(username, displayName, text, imageUrl, audioUrl, videoUrl) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  // 先插入新留言（不设created_at，让数据库用now()自动填充）
  const { error: insertErr } = await supabaseClient
    .from('messages')
    .insert({
      username: username,
      display_name: displayName,
      text: text || '',
      image_url: imageUrl || null,
      audio_url: audioUrl || null,
      video_url: videoUrl || null
    });
  if (insertErr) {
    console.error('[发布新闻] 插入失败:', insertErr);
    throw new Error('发布失败: ' + insertErr.message);
  }
  // 插入成功后，查询所有消息（按id排序），只保留最新2条
  const { data: allMsgs, error: selectErr } = await supabaseClient
    .from('messages')
    .select('id')
    .order('id', { ascending: true });
  if (selectErr) {
    console.warn('[发布新闻] 查询旧消息失败:', selectErr);
    return; // 发布已成功，只是清理失败，不阻塞
  }
  if (allMsgs && allMsgs.length > 2) {
    const idsToDelete = allMsgs.slice(0, allMsgs.length - 2).map(m => m.id);
    const { error: delErr } = await supabaseClient
      .from('messages')
      .delete()
      .in('id', idsToDelete);
    if (delErr) console.warn('[发布新闻] 清理旧消息失败（不影响发布）:', delErr);
  }
}

// 上传图片到 Supabase Storage（共享文件名，任何账号上传都覆盖旧图）
async function uploadImage(file, username) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const ext = file.name.split('.').pop().toLowerCase();
  const fixedPath = `shared_image.${ext}`;

  // 上传新图（upsert: true 直接覆盖，避免先删后传的竞态）
  const { data, error } = await supabaseClient.storage
    .from('images')
    .upload(fixedPath, file, { contentType: file.type, upsert: true });
  if (error) {
    console.error('[上传图片] 失败:', error);
    throw new Error('图片上传失败: ' + error.message);
  }
  const { data: urlData } = supabaseClient.storage
    .from('images')
    .getPublicUrl(fixedPath);
  return urlData.publicUrl + '?t=' + Date.now();
}

// 上传视频到 Supabase Storage（共享文件名，任何账号上传都覆盖旧视频）
async function uploadVideo(file, username) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const ext = file.name.split('.').pop().toLowerCase();
  const fixedPath = `shared_video.${ext || 'mp4'}`;

  // 上传新视频（upsert: true 直接覆盖）
  const { data, error } = await supabaseClient.storage
    .from('images')
    .upload(fixedPath, file, { contentType: file.type || 'video/mp4', upsert: true });
  if (error) {
    console.error('[上传视频] 失败:', error);
    throw new Error('视频上传失败: ' + error.message);
  }
  const { data: urlData } = supabaseClient.storage
    .from('images')
    .getPublicUrl(fixedPath);
  return urlData.publicUrl + '?t=' + Date.now();
}

// 上传语音到 Supabase Storage（共享文件名，任何账号上传都覆盖旧语音）
async function uploadAudio(blob, username) {
  if (!supabaseClient) throw new Error('Supabase 未初始化');
  const ext = blob.type.includes('mp4') ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const fixedPath = `shared_voice.${ext}`;

  // 上传（upsert: true 直接覆盖）
  const { data, error } = await supabaseClient.storage
    .from('images')
    .upload(fixedPath, blob, { contentType: blob.type || 'audio/webm', upsert: true });
  if (error) {
    console.error('[上传语音] 失败:', error);
    throw new Error('语音上传失败: ' + error.message);
  }

  const { data: urlData } = supabaseClient.storage
    .from('images')
    .getPublicUrl(fixedPath);
  return urlData.publicUrl + '?t=' + Date.now();
}

let pendingVoiceBlob = null;
let pendingVoiceMime = 'audio/webm';
let mediaRecorder = null;
let recChunks = [];
let recTimer = null;
let recSeconds = 0;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // 选择浏览器支持的 mimeType（优先m4a兼容Safari/iOS）
    let mimeType = 'audio/webm';
    if (MediaRecorder.isTypeSupported('audio/mp4')) {
      mimeType = 'audio/mp4';
    } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
      mimeType = 'audio/webm;codecs=opus';
    } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
      mimeType = 'audio/ogg;codecs=opus';
    }
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    recChunks = [];
    recSeconds = 0;
    const finalMimeType = mimeType;

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      pendingVoiceBlob = new Blob(recChunks, { type: finalMimeType });
      pendingVoiceMime = finalMimeType;
      const dur = recSeconds;
      document.getElementById('recording-bar').classList.remove('show');
      document.getElementById('voice-btn').classList.remove('recording');
      document.getElementById('voice-preview').classList.add('show');
      document.getElementById('voice-dur').textContent = `${dur}秒`;
      clearInterval(recTimer);
    };

    mediaRecorder.start();
    document.getElementById('recording-bar').classList.add('show');
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('rec-timer').textContent = '0:00';

    recTimer = setInterval(() => {
      recSeconds++;
      const m = Math.floor(recSeconds / 60);
      const s = recSeconds % 60;
      document.getElementById('rec-timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (recSeconds >= 60) stopRecording();
    }, 1000);
  } catch (err) {
    console.error('无法获取麦克风:', err);
    alert('无法访问麦克风，请检查权限设置');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

function cancelVoice() {
  pendingVoiceBlob = null;
  document.getElementById('voice-preview').classList.remove('show');
  document.getElementById('voice-dur').textContent = '';
}

async function doLogin() {
  const account = document.getElementById('login-account').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errorEl = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');

  if (!account || !password) {
    errorEl.textContent = '请输入账号和密码';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '验证中...';
  errorEl.textContent = '';

  try {
    const result = await verifyLogin(account, password);
    if (!result || result.length === 0) {
      errorEl.textContent = '活动火热，稍后再试';
      return;
    }

    currentUser = {
      username: account,
      displayName: result[0].display_name
    };

    // AI助手tab仅0110账号可见
    const aiTab = document.querySelector('.ai-only-tab');
    if (aiTab) aiTab.style.display = account === '0110' ? '' : 'none';

    // 加载留言并进入会员页
    const messages = await fetchMessages();
    document.getElementById('public-page').classList.remove('active');
    document.getElementById('member-page').classList.add('active');
    renderNews('member-news-grid', 'member-news-date', messages);
    // 登录后重新初始化对讲机（用正确的用户名作为Presence key）
    initWalkieTalkie();
    // 订阅messages表实时变更，新消息立即刷新评论
    subscribeMessageChanges();

  } catch (err) {
    console.error('登录失败:', err);
    errorEl.textContent = '活动火热，稍后再试';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '发布新闻';
  }
}

function doLogout() {
  currentUser = null;
  pendingImage = null;
  pendingImageFile = null;
  pendingVideoFile = null;
  pendingVoiceBlob = null;
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  // 退出时清理对讲机和Presence频道，避免残留在线状态
  if (walkieChannel) { try { supabaseClient.removeChannel(walkieChannel); } catch(e) {} walkieChannel = null; }

async function doSendMessage() {
  if (!currentUser) return;
  const text = document.getElementById('msg-text').value.trim();
  if (!text && !pendingImageFile && !pendingVideoFile && !pendingVoiceBlob) return;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.textContent = '发布中...';

  try {
    let imageUrl = null;
    let audioUrl = null;

    // 上传图片（如果有）
    if (pendingImageFile) {
      imageUrl = await uploadImage(pendingImageFile, currentUser.username);
    }

    // 上传视频（如果有，Live动态）
    let videoUrl = null;
    if (pendingVideoFile) {
      videoUrl = await uploadVideo(pendingVideoFile, currentUser.username);
    }

    // 上传语音（如果有）
    if (pendingVoiceBlob) {
      audioUrl = await uploadAudio(pendingVoiceBlob, currentUser.username);
    }

    // 发送留言
    await sendMessage(currentUser.username, currentUser.displayName, text, imageUrl, audioUrl, videoUrl);

    // 通知其他客户端有新消息
    notifyNewMessage();

    // 清空输入
    document.getElementById('msg-text').value = '';
    pendingImage = null;
    pendingImageFile = null;
    pendingVideoFile = null;
    pendingVoiceBlob = null;
    document.getElementById('preview-area').innerHTML = '';
    document.getElementById('voice-preview').classList.remove('show');
    document.getElementById('voice-dur').textContent = '';
    // 重置 file input
    const imgInput = document.getElementById('msg-image'); if (imgInput) imgInput.value = '';
    const vidInput = document.getElementById('msg-video'); if (vidInput) vidInput.value = '';

    // 刷新留言
    hasNewMessages = false;  // 发送消息后恢复颜色
    const messages = await fetchMessages();
    renderNews('member-news-grid', 'member-news-date', messages);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  } catch (err) {
    console.error('[发布新闻] 失败:', err);
    // 给用户友好的错误提示
    let msg = '发布失败';
    if (err.message) {
      if (err.message.includes('上传')) msg = err.message;
      else if (err.message.includes('duplicate') || err.message.includes('已存在')) msg = '文件已存在，请换一张';
      else if (err.message.includes('JWT') || err.message.includes('auth')) msg = '登录已过期，请重新登录';
      else if (err.message.includes('network') || err.message.includes('fetch')) msg = '网络异常，请检查网络后重试';
      else msg = err.message;
    }
    alert(msg);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发布新闻';
  }
}

function initWalkieTalkie() {
  if (!supabaseClient || !currentUser) { console.warn('[对讲机]', 'initWalkieTalkie跳过: supabase=' + !!supabaseClient + ' user=' + !!currentUser); return; }
  walkieChannelReady = false;
  console.log('[对讲机] initWalkieTalkie开始, user=' + currentUser.username);
  // 对讲机频道：只负责语音广播
  if (walkieChannel) { try { supabaseClient.removeChannel(walkieChannel); } catch(e) {} }
  walkieChannel = supabaseClient.channel('walkie-talkie', {
    config: { broadcast: { self: false } }
  });
  console.log('[对讲机] walkieChannel已创建');
  walkieChannel.on('broadcast', { event: 'voice' }, (msg) => {
    if (!walkieSubscribed) return;
    const data = msg.payload && msg.payload.audio ? msg.payload : null;
    if (!data || !data.audio) return;
    console.log('[对讲机] 收到段: segId=' + data.segId + ' idx=' + data.segIndex + ' isLast=' + data.isLast + ' b64Len=' + data.audio.length);
    // 兼容旧版（无segId的单段消息）
    if (!data.segId) {
      playWalkieVoice(data);
      return;
    }
    // 新分段逻辑：缓冲并按序播放
    bufferAndPlaySegment(data);
  });
  walkieChannel.subscribe((status, err) => {
    console.log('[对讲机] 频道状态:', status, err || '');
    walkieChannelReady = (status === 'SUBSCRIBED');
  });
  // 在线状态频道：独立Presence追踪
  if (presenceChannel) { try { supabaseClient.removeChannel(presenceChannel); } catch(e) {} }
  presenceChannel = supabaseClient.channel('online-presence', {
    config: { presence: { key: currentUser.username } }
  });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    const state = presenceChannel.presenceState();
    onlineSubscribers = {};
    onlineCount = 0;
    for (const key in state) {
      const presences = state[key];
      if (presences && presences.length > 0) {
        onlineCount++;
        const latest = presences[presences.length - 1];
        if (latest.walkieSub) onlineSubscribers[key] = true;
      }
    }
    console.log('在线订阅者:', JSON.stringify(onlineSubscribers), '在线人数:', onlineCount);
    updateAllCopyIcons();
    updateOnlineCountDisplay();
  });
  presenceChannel.subscribe(async (status) => {
    console.log('Presence频道状态:', status);
    if (status === 'SUBSCRIBED') {
      await presenceChannel.track({ walkieSub: walkieSubscribed, online: true });
      // track后立即重新计算在线人数（首次sync可能在track前触发导致漏计自己）
      setTimeout(() => {
        const state = presenceChannel.presenceState();
        onlineCount = 0;
        for (const key in state) {
          const presences = state[key];
          if (presences && presences.length > 0) onlineCount++;
        }
        console.log('track后重新计算在线人数:', onlineCount);
        updateOnlineCountDisplay();
      }, 1000);
    }
  });
  // 初始化开关图标
  document.getElementById('walkie-sub-icon').innerHTML = ICO.speakerOff;
}

// 缓冲分段音频并按序播放
function bufferAndPlaySegment(seg) {
  const bar = document.getElementById('walkie-broadcast-bar');
  // 如果是一个全新的会话（segId不同），清空旧缓冲
  if (seg.segId !== walkiePlaySegId && seg.segIndex === 0) {
    stopWalkieAudio();
    walkiePlayBuffer = {};
    walkieIsPlaying = false;
    walkiePlayIndex = 0;
  }
  walkiePlaySegId = seg.segId;
  if (!walkiePlayBuffer[seg.segId]) walkiePlayBuffer[seg.segId] = [];
  // 按index插入，去重
  const buf = walkiePlayBuffer[seg.segId];
  if (!buf[seg.segIndex]) {
    buf[seg.segIndex] = seg;
    console.log('[对讲机] 缓冲段: idx=' + seg.segIndex + ' bufLen=' + buf.filter(Boolean).length);
  }
  // 如果当前没在播放，从第0段开始
  if (!walkieIsPlaying) {
    walkieIsPlaying = true;
    walkiePlayIndex = 0;
    bar.classList.add('show');
    setGuestIdBroadcasting(true);
    playCurrentSegment();
  }
}

// 播放缓冲中的当前段，播完自动播下一段
async function playCurrentSegment() {
  const bar = document.getElementById('walkie-broadcast-bar');
  const buf = walkiePlayBuffer[walkiePlaySegId];
  if (!buf) { finishAllSegments(); return; }
  const seg = buf[walkiePlayIndex];
  if (!seg) {
    // 下一段还没到，等200ms再试
    if (walkiePlayIndex < 50) { // 防无限等待
      setTimeout(() => playCurrentSegment(), 200);
    } else {
      finishAllSegments();
    }
    return;
  }
  try {
    await playSingleSegment(seg);
    // 播完当前段，播下一段
    walkiePlayIndex++;
    playCurrentSegment();
  } catch(e) {
    console.error('[对讲机] 段播放失败:', e);
    finishAllSegments();
  }
}

function finishAllSegments() {
  const bar = document.getElementById('walkie-broadcast-bar');
  walkieIsPlaying = false;
  walkiePlayIndex = 0;
  // 清理超过1分钟的旧缓冲
  const cutoff = Date.now() - 60000;
  for (const sid in walkiePlayBuffer) {
    const first = walkiePlayBuffer[sid][0];
    if (first && first.ts && first.ts < cutoff) delete walkiePlayBuffer[sid];
  }
  bar.classList.remove('show');
  setGuestIdBroadcasting(false);
  console.log('[对讲机] 全部段播放完');
}

// 播放单个音频段（base64）
async function playSingleSegment(payload) {
  const rawMime = payload.mime || 'audio/webm;codecs=opus';
  const mime = rawMime.split(';')[0];
  console.log('[对讲机] 播放段: idx=' + payload.segIndex + ' mime=' + mime + ' b64Len=' + payload.audio.length);

  // base64 → 二进制
  const binStr = atob(payload.audio);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

  // 方案1: AudioContext
  if (walkieAudioCtx && walkieAudioCtx.state === 'running') {
    try {
      const audioBuffer = await walkieAudioCtx.decodeAudioData(bytes.buffer.slice(0));
      return new Promise((resolve, reject) => {
        const source = walkieAudioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(walkieAudioCtx.destination);
        source.onended = () => { currentWalkieAudio = null; console.log('[对讲机] 段播放完 idx=' + payload.segIndex); resolve(); };
        currentWalkieAudio = source;
        source.start(0);
      });
    } catch(acErr) {
      console.warn('[对讲机] AC解码失败，fallback: ' + acErr.message);
    }
  }

  // 方案2: Audio元素 fallback
  const blob = new Blob([bytes], { type: mime });
  const blobUrl = URL.createObjectURL(blob);
  const audio = new Audio(blobUrl);
  audio._blobUrl = blobUrl;
  currentWalkieAudio = audio;
  audio.volume = 0.9;
  return new Promise((resolve, reject) => {
    audio.onended = () => { URL.revokeObjectURL(blobUrl); currentWalkieAudio = null; console.log('[对讲机] Audio段播放完 idx=' + payload.segIndex); resolve(); };
    audio.onerror = (e) => { URL.revokeObjectURL(blobUrl); currentWalkieAudio = null; reject(new Error('Audio播放失败')); };
    audio.play().catch(reject);
  });
}

// 兼容旧版：单段直接播放（无分段）
async function playWalkieVoice(payload) {
  const bar = document.getElementById('walkie-broadcast-bar');
  try {
    stopWalkieAudio();
    bar.classList.add('show');
    setGuestIdBroadcasting(true);
    await playSingleSegment(payload);
    bar.classList.remove('show');
    setGuestIdBroadcasting(false);
  } catch (e) {
    currentWalkieAudio = null;
    console.error('[对讲机] 播放异常: ' + e.message);
    bar.classList.remove('show');
    setGuestIdBroadcasting(false);
  }
}

// === 发送队列 ===
function enqueueWalkieSegment(base64, mime, segId, segIndex, isLast) {
  walkieSendQueue.push({ base64, mime, segId, segIndex, isLast });
  processWalkieQueue();
}

async function processWalkieQueue() {
  if (walkieIsSending || walkieSendQueue.length === 0) return;
  walkieIsSending = true;
  while (walkieSendQueue.length > 0) {
    const item = walkieSendQueue.shift();
    if (!walkieChannel) { walkieIsSending = false; return; }
    try {
      const result = walkieChannel.send({
        type: 'broadcast',
        event: 'voice',
        payload: { audio: item.base64, mime: item.mime, from: currentUser?.display_name || '匿名', segId: item.segId, segIndex: item.segIndex, isLast: item.isLast, ts: Date.now() }
      });
      console.log('[对讲机] 段已发送 idx=' + item.segIndex + ' isLast=' + item.isLast);
    } catch(e) {
      console.error('[对讲机] 段发送失败 idx=' + item.segIndex, e);
    }
    // 段间间隔100ms，避免Supabase Broadcast限流
    if (walkieSendQueue.length > 0) await new Promise(r => setTimeout(r, 100));
  }
  walkieIsSending = false;
}

function stopWalkieAudio() {
  if (!currentWalkieAudio) return;
  try {
    // AudioContext BufferSource
    if (currentWalkieAudio.stop) currentWalkieAudio.stop();
    // Audio元素
    if (currentWalkieAudio.pause) currentWalkieAudio.pause();
    if (currentWalkieAudio._blobUrl) URL.revokeObjectURL(currentWalkieAudio._blobUrl);
  } catch(e) {}
  currentWalkieAudio = null;
}

function startPTT(e) {
  e.preventDefault();
  if (pttActive || !supabaseClient || !walkieChannel) return;
  if (!walkieChannelReady) { console.error('[对讲机] ❌ 频道未就绪，无法录音！'); return; }
  pttActive = true;
  pttChunks = [];
  // 新会话：生成segId，重置段序号
  walkieSegId = 'wt_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
  walkieSegIndex = 0;
  const btn = document.getElementById('walkie-btn');
  btn.classList.add('ptt-active');

  // 选择录音格式（优先opus压缩格式）
  const mimeOptions = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  let selectedMime = '';
  for (const m of mimeOptions) {
    if (MediaRecorder.isTypeSupported(m)) { selectedMime = m; break; }
  }
  if (!selectedMime) { pttActive = false; btn.classList.remove('ptt-active'); alert('浏览器不支持录音'); return; }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    pttRecorder = new MediaRecorder(stream, { mimeType: selectedMime });
    // 每2秒产出一个数据块（timeslice=2000ms），实现分段实时发送
    pttRecorder.ondataavailable = (ev) => {
      if (ev.data.size === 0) return;
      const blob = ev.data;
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        if (base64) {
          console.log('[对讲机] 段就绪: idx=' + walkieSegIndex + ' b64Len=' + base64.length);
          // 不在这标记isLast，由onstop统一处理最后一段
          enqueueWalkieSegment(base64, selectedMime, walkieSegId, walkieSegIndex, false);
          walkieSegIndex++;
        }
      };
      reader.readAsDataURL(blob);
    };
    pttRecorder.onstop = () => {
      if (pttTimer) { clearTimeout(pttTimer); pttTimer = null; }
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('ptt-active');
      pttActive = false;
      // 把最后一包标记为isLast（通过补发一个空段标记结束）
      if (walkieSegIndex > 0) {
        // 最后一段已在ondataavailable中入队，这里只需补一个isLast标记
        // 由于onstop前最后一次的ondataavailable已经入队了最后一段（isLast=false）
        // 我们修改队尾的isLast为true
        // 简化处理：入队时全部isLast=false，在stop时把最后一个改为true
        for (let i = walkieSendQueue.length - 1; i >= 0; i--) {
          if (walkieSendQueue[i].segId === walkieSegId) {
            walkieSendQueue[i].isLast = true;
            break;
          }
        }
      }
      console.log('[对讲机] 录音结束, 总段数=' + walkieSegIndex);
    };
    // start(2000) = 每2秒触发一次ondataavailable，实现分段实时发送
    pttRecorder.start(2000);
    console.log('[对讲机] 分段录音开始, mime=' + selectedMime + ' timeslice=2000ms');
    // 最长录音30秒
    pttTimer = setTimeout(() => { if (pttRecorder && pttRecorder.state === 'recording') pttRecorder.stop(); }, 30000);
  }).catch(err => {
    console.error('麦克风获取失败:', err);
    btn.classList.remove('ptt-active');
    pttActive = false;
  });
}

function stopPTT(e) {
  e.preventDefault();
  if (pttTimer) { clearTimeout(pttTimer); pttTimer = null; }
  if (pttRecorder && pttRecorder.state === 'recording') {
    pttRecorder.stop();
  }
}

// AI助手链接配置（localStorage持久化）
const AI_URL_KEY = 'paynews_ai_url';
function initAIConfig() {
  const savedUrl = localStorage.getItem(AI_URL_KEY);
  const input = document.getElementById('ai-url-input');
  const iframe = document.getElementById('ai-assistant-iframe');
  if (savedUrl && input) {
    input.value = savedUrl;
    if (iframe && iframe.src !== savedUrl) {
      iframe.src = savedUrl;
    }
  } else if (input && iframe) {
    input.value = iframe.src;
  }
}
function saveAIUrl() {
  const input = document.getElementById('ai-url-input');
  const iframe = document.getElementById('ai-assistant-iframe');
  if (!input || !iframe) return;
  let url = input.value.trim();
  if (!url) { alert('请输入链接地址'); return; }
  if (!/^https?:\/\//i.test(url)) {
    if (confirm('链接不以http开头，是否自动补全https://？')) {
      url = 'https://' + url;
      input.value = url;
    } else {
      return;
    }
  }
  localStorage.setItem(AI_URL_KEY, url);
  // 自动刷新iframe
  iframe.src = url;
  console.log('[AI配置] 已保存并刷新:', url);
}
function refreshAIFrame() {
  const iframe = document.getElementById('ai-assistant-iframe');
  if (!iframe) return;
  // 重新赋值src触发刷新
  const currentSrc = iframe.src;
  iframe.src = '';
  setTimeout(() => { iframe.src = currentSrc; }, 50);
}
// AI助手iframe自适应高度
function resizeAIIFrame() {
  const iframe = document.getElementById('ai-assistant-iframe');
  if (!iframe) return;
  // 从配置栏底部开始计算，视口底部作为终点
  const configBar = document.querySelector('.ai-config-bar');
  const bottomPadding = 16;

  if (configBar) {

}

// 渲染右边tab：只取最后1条评论卡片（逻辑与行业简报的评论卡片完全一致）
function gkRenderNews(messages) {
  const container = document.getElementById('gk-news-grid');
  if (!container) return;

  let html = '';
  if (messages && messages.length > 0) {
    const newestMsg = messages[messages.length - 1];
    const olderMsg = messages.length >= 2 ? messages[messages.length - 2] : null;

    let msgHtml = `<div class="news-item">`;
    const ts = newestMsg.created_at ? new Date(newestMsg.created_at) : new Date();
    const hh = String(ts.getHours()).padStart(2,'0');
    const mm = String(ts.getMinutes()).padStart(2,'0');
    const ss = String(ts.getSeconds()).padStart(2,'0');
    msgHtml += `<div class="news-category-line"><div class="news-category">最新评论</div><div class="guest-id"><span class="online-count">${onlineCount > 0 ? onlineCount : ""}</span>线上网友${hh}${mm}${ss}</div></div>`;
    if (newestMsg.text) msgHtml += `<h3>${escapeHtml(newestMsg.text)}</h3>`;
    // 评论下方：第一条新闻摘要 + 上一条评论（小字灰色），与行业简报逻辑一致
    let summaryContent = '';
    if (MOCK_NEWS.length > 0) summaryContent = MOCK_NEWS[0].summary;
    if (olderMsg && olderMsg.text) {
      summaryContent += `<span style="color:var(--text-dim);font-size:13px;"> ${escapeHtml(olderMsg.text)}</span>`;
    }
    if (summaryContent) msgHtml += `<p>${summaryContent}</p>`;
    if (newestMsg.image_url) msgHtml += `<span class="img-toggle" onclick="toggleImg(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> 查看图片</span><div class="img-fold"><img src="${newestMsg.image_url}" alt="配图" onclick="showOverlay(this.src)"></div>`;
    if (newestMsg.video_url) msgHtml += `<span class="img-toggle" onclick="toggleVideo(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4V8z"/></svg> 查看视频</span><div class="img-fold"><video controls preload="metadata" playsinline style="max-width:100%;border-radius:6px;"><source src="${newestMsg.video_url}" type="video/mp4">您的浏览器不支持视频播放</video></div>`;
    if (newestMsg.audio_url) msgHtml += `<audio controls src="${newestMsg.audio_url}" preload="metadata">您的浏览器不支持语音播放</audio>`;
    const copyText = newestMsg.text || '';
    msgHtml += `<span class="copy-heart" onclick="copyComment(this, '${escapeHtml(copyText).replace(/'/g, "\\'")}')" title="复制评论">${getCopyIcon()}</span>`;
    msgHtml += `</div>`;
    html += msgHtml;
  }

  container.innerHTML = html;
}

// 清理Storage中的图片和语音文件，同时置空messages中的媒体链接
// 注意：语音文件由本函数管理生命周期，不置空audio_url（避免播放器消失）
async function cleanupStorage() {
  if (!supabaseClient) return;
  try {
    // 列出images bucket中的所有文件
    const { data: files, error } = await supabaseClient.storage.from('images').list('', { limit: 100 });
    if (error) { console.warn('列出存储文件失败:', error); return; }
    if (files && files.length > 0) {
      // 分离图片、视频和语音文件
      const imageFiles = files.filter(f => f.name.startsWith('shared_image'));
      const voiceFiles = files.filter(f => f.name.startsWith('shared_voice'));
      const videoFiles = files.filter(f => f.name.startsWith('shared_video'));

      // 图片文件：立即删除（与图片生命周期一致）
      if (imageFiles.length > 0) {
        const imagePaths = imageFiles.map(f => f.name);
        const { error: delErr } = await supabaseClient.storage.from('images').remove(imagePaths);
        if (delErr) console.warn('删除图片文件失败:', delErr);
        else console.log(`已清理 ${imagePaths.length} 个图片文件`);
      }

      const thirtyMinAgo = Date.now() - 30 * 60 * 1000;

      // 视频文件：只删除超过30分钟的旧视频
      const oldVideoFiles = videoFiles.filter(f => new Date(f.created_at).getTime() < thirtyMinAgo);
      if (oldVideoFiles.length > 0) {
        const videoPaths = oldVideoFiles.map(f => f.name);
        await supabaseClient.storage.from('images').remove(videoPaths);
        // 旧视频删除后，置空对应的video_url
        const { error: msgErr } = await supabaseClient
          .from('messages')
          .update({ video_url: null })
          .not('video_url', 'is', null);
        if (msgErr) console.warn('清理视频链接失败:', msgErr);
      }

      // 语音文件：只删除超过30分钟的旧语音
      const oldVoiceFiles = voiceFiles.filter(f => new Date(f.created_at).getTime() < thirtyMinAgo);
      if (oldVoiceFiles.length > 0) {
        const voicePaths = oldVoiceFiles.map(f => f.name);
        await supabaseClient.storage.from('images').remove(voicePaths);
        // 旧语音删除后，置空对应的audio_url
        const { error: msgErr } = await supabaseClient
          .from('messages')
          .update({ audio_url: null })
          .not('audio_url', 'is', null);
        if (msgErr) console.warn('清理语音链接失败:', msgErr);
      }
    }
    // 三类媒体均已统一30分钟清理策略，此处仅兜底置空image_url
    const { error: msgErr } = await supabaseClient
      .from('messages')
      .update({ image_url: null })
      .not('image_url', 'is', null);
    if (msgErr) console.warn('清理消息图片链接失败:', msgErr);
  } catch (e) {
    console.warn('Storage清理异常:', e);
  }
}

// 点击"准备"：匹配模式
async function gomokuReady() {
  if (!supabaseClient || !currentUser) return;
  await gkCleanup();
  gkStopPoll();

  // 清理自己的旧等待游戏（防止残留）
  await supabaseClient.from('gomoku_games').delete().eq('player1', currentUser.username).eq('status', 'waiting');
  await supabaseClient.from('gomoku_games').delete().eq('player2', currentUser.username).eq('status', 'waiting');

  // 1. 先尝试加入别人等待中的游戏
  const joined = await gkTryJoin();
  if (joined) return;

  // 2. 没人等 → 自己创建等待
  const board = '0'.repeat(GK_SIZE * GK_SIZE);
  const { data: created, error } = await supabaseClient
    .from('gomoku_games')
    .insert({
      player1: currentUser.username,
      player1_name: currentUser.displayName,
      board: board,
      current_turn: 1,
      status: 'waiting',
      winner: 0
    })
    .select()
    .single();
  if (error) { alert('准备失败: ' + error.message); return; }
  gkCurrentGame = { ...created, myRole: 1 };

  // 3. 创建后再检查一次（防止两人同时创建导致双方都在等）
  const recheck = await gkTryJoinOther(created.id);
  if (recheck) return;

  gkShow('waiting');
  gkStartPoll('waiting');
}

// 尝试加入别人等待中的游戏
async function gkTryJoin() {
  const { data: waiting } = await supabaseClient
    .from('gomoku_games')
    .select('*')
    .eq('status', 'waiting')
    .neq('player1', currentUser.username)
    .order('created_at', { ascending: true })
    .limit(1);
  if (!waiting || waiting.length === 0) return false;

  const g = waiting[0];
  const { data: updated } = await supabaseClient
    .from('gomoku_games')
    .update({ player2: currentUser.username, player2_name: currentUser.displayName, status: 'playing' })
    .eq('id', g.id)
    .is('player2', null)  // 原子保护：只有player2仍为空才能加入
    .select()
    .single();
  if (!updated || updated.player2 !== currentUser.username) return false;

  gkCurrentGame = { ...updated, myRole: 2 };
  gkRenderGame();
  gkShow('game');
  gkStartPoll('game');
  return true;
}

// 自己已创建等待游戏后，再检查是否有别人也在等（解决双方同时创建的问题）
async function gkTryJoinOther(myGameId) {
  const { data: waiting } = await supabaseClient
    .from('gomoku_games')
    .select('*')
    .eq('status', 'waiting')
    .neq('player1', currentUser.username)
    .neq('id', myGameId)
    .order('created_at', { ascending: true })
    .limit(1);
  if (!waiting || waiting.length === 0) return false;

  const g = waiting[0];
  // 只加入比自己更早创建的游戏（后创建的让先创建的）
  if (new Date(g.created_at) > new Date()) return false;

  const { data: updated } = await supabaseClient
    .from('gomoku_games')
    .update({ player2: currentUser.username, player2_name: currentUser.displayName, status: 'playing' })
    .eq('id', g.id)
    .is('player2', null)
    .select()
    .single();
  if (!updated || updated.player2 !== currentUser.username) return false;

  // 加入成功，删除自己的等待游戏
  await supabaseClient.from('gomoku_games').delete().eq('id', myGameId);
  gkCurrentGame = { ...updated, myRole: 2 };
  gkRenderGame();
  gkShow('game');
  gkStartPoll('game');
  return true;
}

// 取消等待
async function gomokuCancelReady() {
  if (!gkCurrentGame) return;
  await supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id);
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}

// 等待中的轮询：检查对手 + 主动寻找匹配
async function gkSyncWaiting() {
  if (!gkCurrentGame) return;
  const { data } = await supabaseClient.from('gomoku_games').select('*').eq('id', gkCurrentGame.id).single();
  if (!data) { gkCurrentGame = null; gkStopPoll(); gkShow('lobby'); return; }
  gkCurrentGame = { ...data, myRole: gkCurrentGame.myRole };

  // 有人加入了！
  if (data.status === 'playing' && data.player2) {
    gkStopPoll();
    gkRenderGame();
    gkShow('game');
    gkStartPoll('game');
    return;
  }

  // 主动寻找：检查是否有别人也在等（解决双方同时创建等待的问题）
  const { data: others } = await supabaseClient
    .from('gomoku_games')
    .select('*')
    .eq('status', 'waiting')
    .neq('player1', currentUser.username)
    .neq('id', gkCurrentGame.id)
    .order('created_at', { ascending: true })
    .limit(1);
  if (others && others.length > 0 && new Date(others[0].created_at) < new Date(gkCurrentGame.created_at)) {
    // 对方比我更早创建，我去加入对方
    const g = others[0];
    const { data: updated } = await supabaseClient
      .from('gomoku_games')
      .update({ player2: currentUser.username, player2_name: currentUser.displayName, status: 'playing' })
      .eq('id', g.id)
      .is('player2', null)
      .select()
      .single();
    if (updated && updated.player2 === currentUser.username) {
      // 加入成功，删除自己的等待游戏
      await supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id);
      gkCurrentGame = { ...updated, myRole: 2 };
      gkStopPoll();
      gkRenderGame();
      gkShow('game');
      gkStartPoll('game');
    }
  }
}

// 游戏中轮询
async function gkSyncGame() {
  if (!gkCurrentGame) return;
  const { data } = await supabaseClient.from('gomoku_games').select('*').eq('id', gkCurrentGame.id).single();
  if (!data) { gomokuBackLobby(); return; }
  gkCurrentGame = { ...data, myRole: gkCurrentGame.myRole };
  if (data.status === 'finished') {
    gkStopPoll();
    const w = data.winner;
    const myRole = gkCurrentGame.myRole;
    let txt = w === 3 ? '平局！' : (w === myRole ? '🎉 你赢了！' : '😢 你输了');
    document.getElementById('gk-result-text').textContent = txt;
    gkShow('result');
    // 自动清理
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', data.id), 5000);
    return;
  }
  gkRenderGame();
}

function gkRenderGame() {
  if (!gkCurrentGame) return;
  const g = gkCurrentGame;
  const isPlaying = g.status === 'playing';
  const p1el = document.getElementById('gk-p1');
  const p2el = document.getElementById('gk-p2');
  const turnEl = document.getElementById('gk-turn-info');
  p1el.textContent = '⚫ ' + (g.player1_name || '???');
  p2el.textContent = '⚪ ' + (g.player2_name || '???');
  p1el.classList.toggle('active', isPlaying && g.current_turn === 1);
  p2el.classList.toggle('active', isPlaying && g.current_turn === 2);
  turnEl.textContent = isPlaying ? (g.current_turn === g.myRole ? '轮到你了' : '对方思考中...') : 'VS';
  gkRenderBoard(g);
}

function gkRenderBoard(g) {
  const boardEl = document.getElementById('gk-board');
  const board = g.board || '0'.repeat(225);
  const isPlaying = g.status === 'playing';
  const isMyTurn = isPlaying && g.current_turn === g.myRole;
  let lastIdx = -1;
  if (g.last_move) lastIdx = g.last_move;

  let html = '';
  for (let i = 0; i < 225; i++) {
    const v = parseInt(board[i]);
    const isLast = i === lastIdx;
    let inner = '';
    if (v === 1) inner = '<div class="gk-stone black"></div>';
    else if (v === 2) inner = '<div class="gk-stone white"></div>';
    const clickable = isMyTurn && v === 0;
    html += `<div class="gk-cell${isLast ? ' last-move' : ''}" ${clickable ? `onclick="gomokuPlace(${i})"` : ''}>${inner}</div>`;
  }
  boardEl.innerHTML = html;
}

async function gomokuPlace(idx) {
  if (!gkCurrentGame || gkCurrentGame.status !== 'playing') return;
  if (gkCurrentGame.current_turn !== gkCurrentGame.myRole) return;
  const board = gkCurrentGame.board;
  if (board[idx] !== '0') return;

  const newBoard = board.substring(0, idx) + String(gkCurrentGame.myRole) + board.substring(idx + 1);
  const nextTurn = gkCurrentGame.myRole === 1 ? 2 : 1;
  const win = gkCheckWin(newBoard, idx, gkCurrentGame.myRole);

  if (win) {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, status: 'finished', winner: gkCurrentGame.myRole, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.status = 'finished';
    gkCurrentGame.winner = gkCurrentGame.myRole;
    gkRenderBoard(gkCurrentGame);
    document.getElementById('gk-result-text').textContent = '🎉 你赢了！';
    gkShow('result');
    gkStopPoll();
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id), 5000);
  } else if (newBoard.indexOf('0') === -1) {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, status: 'finished', winner: 3, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.status = 'finished';
    gkRenderBoard(gkCurrentGame);
    document.getElementById('gk-result-text').textContent = '平局！';
    gkShow('result');
    gkStopPoll();
    setTimeout(() => supabaseClient.from('gomoku_games').delete().eq('id', gkCurrentGame.id), 5000);
  } else {
    await supabaseClient.from('gomoku_games').update({
      board: newBoard, current_turn: nextTurn, last_move: idx, updated_at: new Date().toISOString()
    }).eq('id', gkCurrentGame.id);
    gkCurrentGame.board = newBoard;
    gkCurrentGame.current_turn = nextTurn;
    gkRenderBoard(gkCurrentGame);
  }
}

function gkCheckWin(board, idx, player) {
  const row = Math.floor(idx / GK_SIZE), col = idx % GK_SIZE;
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const r = row + dr*d, c = col + dc*d;
      if (r < 0 || r >= GK_SIZE || c < 0 || c >= GK_SIZE) break;
      if (board[r * GK_SIZE + c] !== String(player)) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const r = row - dr*d, c = col - dc*d;
      if (r < 0 || r >= GK_SIZE || c < 0 || c >= GK_SIZE) break;
      if (board[r * GK_SIZE + c] !== String(player)) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

function gomokuLeave() {
  if (!gkCurrentGame) return;
  const g = gkCurrentGame;
  if (g.status === 'waiting') {
    supabaseClient.from('gomoku_games').delete().eq('id', g.id);
  } else if (g.status === 'playing') {
    const winner = g.myRole === 1 ? 2 : 1;
    supabaseClient.from('gomoku_games').update({ status: 'finished', winner: winner, updated_at: new Date().toISOString() }).eq('id', g.id);
  }
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}

function gomokuBackLobby() {
  gkCurrentGame = null;
  gkStopPoll();
  gkShow('lobby');
}


// ===== 语音房间 (PeerJS P2P + Supabase 房间发现) =====
let peer = null;
let localStream = null;
let screenStream = null;
let voiceJoined = false;
let micEnabled = true;
let cameraEnabled = false;
let screenSharing = false;
let speakerEnabled = true;
let remotePeers = {};
let remoteStreams = {};
let heartbeatTimer = null;
let discoveryTimer = null;
let outgoingCalls = {};

const ROOM_ID = 'paynews_room_2026';
let myPeerId = '';

function toggleVoiceRoom() {
  if (voiceJoined) {
    leaveVoiceRoom();
  } else {
    joinVoiceRoom();
  }
}

async function joinVoiceRoom() {
  try {
    // 显示连接中状态
    const status = document.getElementById('voice-status-line');
    if (status) status.innerHTML = '<span class="dot on"></span>连接中...';
    // 获取本地音频流
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

    // 生成唯一 peer ID
    myPeerId = 'pn_' + Math.random().toString(36).substring(2, 10);

    // 创建 PeerJS
    peer = new Peer(myPeerId, {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    });

    peer.on('open', async (id) => {
      console.log('PeerJS 已连接:', id);
      // 注册到 Supabase 房间
      await registerInRoom(id);
      // 启动心跳（每 10 秒更新一次）
      heartbeatTimer = setInterval(() => updateHeartbeat(id), 10000);
      // 启动房间发现（每 5 秒检查新成员）
      discoveryTimer = setInterval(() => discoverPeers(id), 5000);
      // 立即执行一次发现
      await discoverPeers(id);
      // PeerJS 连接成功，更新 UI
      voiceJoined = true;
      micEnabled = true;
      updateVoiceUI(true);
      updateVoiceUserCount();
      document.getElementById('peerjs-voice-area').classList.add('active');
    });

    peer.on('call', (call) => {
      if (remotePeers[call.peer] || outgoingCalls[call.peer]) return;
      console.log('收到来电:', call.peer);
      call.answer(localStream);
      handleCallStream(call);
    });

    peer.on('connection', (conn) => {
      console.log('数据连接:', conn.peer);
    });

    peer.on('disconnected', () => {
      console.log('PeerJS 断开，重连中...');
      setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
    });

    peer.on('error', (err) => {
      console.error('PeerJS 错误:', err.type, err.message);
      if (err.type === 'unavailable-id') {
        // ID 冲突，换一个新的
        if (peer) peer.destroy();
        myPeerId = 'pn_' + Math.random().toString(36).substring(2, 10);
        setTimeout(() => joinVoiceRoom(), 500);
      }
    });


  } catch(e) {
    console.error('加入用户旅程失败:', e);
    alert('加入用户旅程失败: ' + e.message);
    cleanupPeerJS();
  }
}

async function registerInRoom(peerId) {
  try {
    const displayName = currentUser ? (currentUser.displayName || currentUser.username) : '匿名用户';
    const { data, error } = await supabaseClient
      .from('voice_peers')
      .upsert({
        id: peerId,
        peer_id: peerId,
        room_id: ROOM_ID,
        display_name: displayName,
        last_heartbeat: new Date().toISOString()
      });
    if (error) console.error('注册房间失败:', error);
    else console.log('已注册到房间');
  } catch(e) {
    console.error('注册异常:', e);
  }
}

async function updateHeartbeat(peerId) {
  try {
    await supabaseClient
      .from('voice_peers')
      .update({ last_heartbeat: new Date().toISOString() })
      .eq('id', peerId);
  } catch(e) {
    // 静默失败
  }
}

async function discoverPeers(myId) {
  try {
    // 查询房间内的活跃成员（30秒内有心跳的）
    const thirtySecsAgo = new Date(Date.now() - 30000).toISOString();
    const { data, error } = await supabaseClient
      .from('voice_peers')
      .select('id, peer_id, display_name')
      .eq('room_id', ROOM_ID)
      .gte('last_heartbeat', thirtySecsAgo)
      .neq('id', myId);

    if (error) {
      console.error('发现成员失败:', error);
      return;
    }

    if (!data || data.length === 0) return;

    data.forEach(row => {
      const remoteId = row.peer_id || row.id;
      if (remoteId !== myId && !remotePeers[remoteId]) {
        console.log('发现新成员，主动呼叫:', remoteId);
        callPeer(remoteId);
      }
    });
  } catch(e) {
    console.error('发现异常:', e);
  }
}

function callPeer(remoteId) {
  if (!localStream || remoteId === myPeerId) return;
  if (remotePeers[remoteId]) return; // 已在通话中

  const currentStream = screenStream || localStream;
  const call = peer.call(remoteId, currentStream);
  if (call) {
    outgoingCalls[remoteId] = call;
    handleCallStream(call);
  }
}

function handleCallStream(call) {
  const remoteId = call.peer;

  call.on('stream', (remoteStream) => {
    console.log('收到远端流:', remoteId);
    remotePeers[remoteId] = call;
    remoteStreams[remoteId] = remoteStream;
    playRemoteStream(remoteId, remoteStream);
    updateVoiceUserCount();
  });

  call.on('close', () => {
    console.log('通话关闭:', remoteId);
    removeRemotePeer(remoteId);
  });

  call.on('error', (err) => {
    console.error('通话错误:', remoteId, err);
    removeRemotePeer(remoteId);
  });
}

function playRemoteStream(peerId, stream) {
  const grid = document.getElementById('voice-video-grid');

  let container = document.getElementById('peer-' + peerId);
  if (!container) {
    container = document.createElement('div');
    container.id = 'peer-' + peerId;
    container.style.textAlign = 'center';

    const label = document.createElement('div');
    label.style.fontSize = '11px';
    label.style.color = 'var(--text-muted)';
    label.style.marginTop = '4px';
    label.textContent = '用户 ' + peerId.slice(-4);
    container.appendChild(label);
    grid.appendChild(container);
  }

  const hasVideo = stream.getVideoTracks().length > 0;

  if (hasVideo) {
    // 移除旧的 audio 元素（如果有）
    const oldAudio = container.querySelector('audio');
    if (oldAudio) oldAudio.remove();

    let videoEl = container.querySelector('video');
    if (!videoEl) {
      videoEl = document.createElement('video');
      videoEl.autoplay = true;
      videoEl.playsInline = true;
      videoEl.muted = !speakerEnabled;
      container.insertBefore(videoEl, container.firstChild);
    }
    videoEl.srcObject = stream;
  } else {
    // 纯音频
    let audioEl = container.querySelector('audio');
    if (!audioEl) {
      audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      audioEl.muted = !speakerEnabled;
      container.insertBefore(audioEl, container.firstChild);
    }
    audioEl.srcObject = stream;
  }
}

function removeRemotePeer(peerId) {
  delete remotePeers[peerId];
  delete remoteStreams[peerId];
  delete outgoingCalls[peerId];
  const container = document.getElementById('peer-' + peerId);
  if (container) container.remove();
  updateVoiceUserCount();
}

async function leaveVoiceRoom() {
  // 从 Supabase 移除自己
  if (myPeerId) {
    try {
      await supabaseClient.from('voice_peers').delete().eq('id', myPeerId);
    } catch(e) {}
  }

  // 清除定时器
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (discoveryTimer) { clearInterval(discoveryTimer); discoveryTimer = null; }

  cleanupPeerJS();
  voiceJoined = false;
  myPeerId = '';
  updateVoiceUI(false);
  document.getElementById('peerjs-voice-area').classList.remove('active');
}

function cleanupPeerJS() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
  }

  Object.keys(remotePeers).forEach(id => {
    if (remotePeers[id]) remotePeers[id].close();
  });
  remotePeers = {};
  remoteStreams = {};

  const grid = document.getElementById('voice-video-grid');
  if (grid) grid.innerHTML = '';

  if (peer) {
    peer.destroy();
    peer = null;
  }

  updateVoiceUserCount();
}

function toggleMic() {
  if (!localStream) return;
  const audioTracks = localStream.getAudioTracks();
  if (micEnabled) {
    audioTracks.forEach(t => t.enabled = false);
    micEnabled = false;
    document.getElementById('btn-mic').classList.remove('active');
    document.getElementById('btn-mic').classList.add('muted');
  } else {
    audioTracks.forEach(t => t.enabled = true);
    micEnabled = true;
    document.getElementById('btn-mic').classList.add('active');
    document.getElementById('btn-mic').classList.remove('muted');
  }
}


function toggleSpeaker() {
  speakerEnabled = !speakerEnabled;
  const btn = document.getElementById('btn-speaker');
  // 静音/取消所有远程媒体元素
  const grid = document.getElementById('voice-video-grid');
  if (grid) {
    grid.querySelectorAll('audio, video').forEach(el => {
      el.muted = !speakerEnabled;
    });
  }
  // 也处理 remote-audio-container
  const remoteContainer = document.getElementById('remote-audio-container');
  if (remoteContainer) {
    remoteContainer.querySelectorAll('audio').forEach(el => {
      el.muted = !speakerEnabled;
    });
  }
  if (speakerEnabled) {
    btn.classList.remove('muted');
    btn.classList.add('active');
  } else {
    btn.classList.remove('active');
    btn.classList.add('muted');
  }
}

async function toggleCamera() {
  if (!voiceJoined) return;

  if (cameraEnabled) {
    if (screenStream && !screenSharing) {
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
    }
    cameraEnabled = false;
    document.getElementById('btn-camera').classList.remove('active');
    reCallAllWithCurrentStream();
  } else {
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      screenStream = camStream;
      cameraEnabled = true;
      document.getElementById('btn-camera').classList.add('active');
      reCallAllWithCurrentStream();
    } catch(e) {
      console.error('开启摄像头失败:', e);
      alert('开启摄像头失败: ' + e.message);
    }
  }
}

async function toggleScreenShare() {
  if (!voiceJoined) return;

  if (screenSharing) {
    if (screenStream) {
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
    }
    screenSharing = false;
    document.getElementById('btn-screen').classList.remove('active');
    reCallAllWithCurrentStream();
  } else {
    try {
      const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      screenStream = displayStream;
      screenSharing = true;
      document.getElementById('btn-screen').classList.add('active');
      displayStream.getVideoTracks()[0].onended = () => {
        screenSharing = false;
        document.getElementById('btn-screen').classList.remove('active');
        if (screenStream === displayStream) screenStream = null;
        reCallAllWithCurrentStream();
      };
      reCallAllWithCurrentStream();
    } catch(e) {
      console.error('屏幕共享失败:', e);
    }
  }
}

function reCallAllWithCurrentStream() {
  const currentStream = screenStream || localStream;
  if (!currentStream) return;

  // 获取当前所有远端 peer ID
  const peerIds = Object.keys(remotePeers);

  // 关闭现有通话
  peerIds.forEach(id => {
    if (remotePeers[id]) remotePeers[id].close();
    delete remotePeers[id];
    delete remoteStreams[id];
  });

  const grid = document.getElementById('voice-video-grid');
  if (grid) grid.innerHTML = '';

  // 重新呼叫所有人
  peerIds.forEach(id => {
    if (id !== myPeerId) {
      callPeer(id);
    }
  });
}

function updateVoiceUI(joined) {
  const btn = document.getElementById('voice-join-btn');
  const status = document.getElementById('voice-status-line');
  if (joined) {
    btn.style.display = 'none';
    status.innerHTML = '<span class="dot on"></span>已连接 · P2P 加密通话';
  } else {
    btn.style.display = '';
    btn.classList.remove('leaving');
    btn.querySelector('span').textContent = '加入用户旅程';
    status.innerHTML = '<span class="dot off"></span>未连接';
  }
}
