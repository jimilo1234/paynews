name: Keep Supabase Awake

# 定时保活：每 5 分钟（UTC）向 Supabase 发一个轻量请求，
# 让免费项目的数据库计算层保持活跃，避免冷启动 20~30s 唤醒等待。
# 配合前端 warmupSupabase() 一起用，体验最稳。
on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟一次（UTC 时间）
  workflow_dispatch: {}      # 允许在 Actions 页面手动点 Run 测试

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase DB + Storage to keep both warm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}        # 例：https://xxxx.supabase.co （不要带结尾斜杠）
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}   # 前端 publishable key（本就公开）
        run: |
          echo "Pinging DB at ${SUPABASE_URL} ..."
          curl -s -m 20 -o /dev/null -w "DB HTTP %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/messages?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"

          echo "Pinging Storage at ${SUPABASE_URL} ..."
          curl -s -m 20 -o /dev/null -w "Storage HTTP %{http_code}\n" \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo "Done."
